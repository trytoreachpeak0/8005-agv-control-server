name: g3-nightly-trigger

# Starts the nightly G3 (control-server#582) and does nothing else. GitHub runs `schedule` only from the workflow files
# on the default branch, which is this one (main), while the nightly G3 itself -- .github/workflows/g3.yml, its jobs,
# its gates and its comment on control-server#581 -- lives on the integration branch fp/v2-impl, which never merges
# here. So this file holds the clock and g3.yml holds everything else; nothing of g3.yml is copied here.
#
# It dispatches g3.yml on fp/v2-impl with ref=fp/v2-impl and nightly=true, the same as
#   gh workflow run g3.yml -R trytoreachpeak0/8005-agv-control-server --ref fp/v2-impl -f ref=fp/v2-impl -f nightly=true
# through the REST call that command makes: the runners have no gh. A dispatch by GITHUB_TOKEN does start a
# workflow run (workflow_dispatch is one of the two events exempt from the rule that GITHUB_TOKEN events start none),
# which needs actions: write.
#
# It depends on g3.yml being on fp/v2-impl. Before that merges, the dispatch is refused (the workflow file is not
# found at that ref) and this run goes red, which is the right signal: no nightly G3 ran.
#
# nightly=true is what makes g3.yml treat the dispatch as the night it stands for (its 07:00 CST start deadline and its
# label), since to g3.yml every run from here is a workflow_dispatch. trigger_cron and triggered_at (the cron this run
# fired for, and when GitHub created this run) let the night's comment say how late GitHub fired it (control-server#807).
# g3.yml must declare both before this sends them, or GitHub refuses the dispatch (Unexpected inputs provided): the
# fp/v2-impl side of control-server#807 merges first. Reading triggered_at may fail; the night is dispatched anyway,
# without it.
#
# 14:37 UTC, 22:37 CST (control-server#807). Until then 01:00 CST, which GitHub started two to six and a half hours late
# (10-11 to 10-19), past g3.yml's 04:00 CST deadline on three of the four nights to 10-20. Off the hour, where GitHub's
# schedule load peaks; after the daytime CI queue (11:00-14:00 and 17:00-20:00 CST); and six and a half hours late still
# starts before g3.yml's 07:00 CST deadline with a round's length to spare. g3.yml itself waits for the CI real rig,
# stops starting runners at that deadline, and comments every night.
#
# The trigger job still runs on the headless runner it shares with L2 (on 10-18 it waited 54 minutes there); moving it to
# a runner of its own is left to the second line of the CI migration (more runners on the new machine), not
# control-server#807.
on:
  schedule:
    - cron: '37 14 * * *'
  # By hand, to check the trigger itself: gh workflow run g3-nightly-trigger.yml -R trytoreachpeak0/8005-agv-control-server
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger:
    runs-on: [self-hosted, headless]
    timeout-minutes: 10
    steps:
      - name: Dispatch g3.yml on fp/v2-impl
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty when this run was dispatched by hand: then the comment says no lateness.
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions"
          # When GitHub created this run, which is when it fired the schedule: the time this job waited for its runner is not lateness.
          $triggeredAt = ''
          try {
              $created = (Invoke-RestMethod -Uri "$api/runs/$env:GITHUB_RUN_ID" -Headers $headers -TimeoutSec 45).created_at
              $triggeredAt = ([DateTimeOffset]$created).ToUniversalTime().ToString('o')
          } catch {
              Write-Host "::warning title=Nightly G3 trigger::Could not read when this run was created, so the comment will not say how late: $($_.Exception.Message)"
          }
          $inputs = @{ ref = 'fp/v2-impl'; nightly = 'true'; trigger_cron = "$env:TRIGGER_CRON"; triggered_at = $triggeredAt }
          $request = @{
              Uri = "$api/workflows/g3.yml/dispatches"
              Method = 'POST'
              Headers = $headers
              Body = (@{ ref = 'fp/v2-impl'; inputs = $inputs } | ConvertTo-Json -Compress)
              ContentType = 'application/json; charset=utf-8'
              TimeoutSec = 45
          }
          Invoke-RestMethod @request | Out-Null
          Write-Host "Dispatched g3.yml on fp/v2-impl (cron '$env:TRIGGER_CRON', triggered at '$triggeredAt'). The run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/workflows/g3.yml"
