name: g3

# The nightly G3 (control-server#582): the four G3 runners -- staged, restart, demand-bearing, journey -- at the tip
# of the integration branch, under a self-check override, with the verdict commented on the fixed issue
# control-server#581 every night, all green included, so that a night with no comment is a night that did not run.
#
# It is NOT gate evidence. The G3 commit binding in run-staged-g3.ps1 is written down on purpose and moves only in a
# batch exit's first step; this runs the runners with -SelfCheckControlServerCommit / -SelfCheckOnboardCommit instead,
# and every slice of every run grades formalSlicePass false with SELF_CHECK_OVERRIDE. What it is for: seeing the day
# after a merge that a change visible to the peer was not followed in a G3 script (cs#478 changed a reply on 10-04
# and the staged G3 found out at the batch-10 exit), instead of at the exit. The simulator and protocol stay at the
# binding (run-journey-g3.ps1 has no override for them); the onboard is the tip of w2g/fp-v2-impl, which the runners'
# clone check requires anyway.
#
# Three jobs:
#   gate    (headless)   resolves the commits and the start deadline, and nothing else: it no longer waits for the CI
#                        real rig (control-server#807, review S1 of PR #817). A night has from 22:37 to 07:00 CST, and
#                        waiting that out here would hold the one headless runner every L2 scenario needs for hours.
#   g3      (cs-desktop) queues for the one cs-desktop runner, which l2.yml's real-rig job also takes: GitHub's queue
#                        holds no runner, and the two take it in turn, so the round never runs beside the real rig
#                        (staged, restart and journey also take the Global\W2G-InteractiveDesktop lock, as the real rig
#                        does). It records when it started, which may be hours after the gate.
#                        scripts/Invoke-NightlyG3.ps1: the four runners in a row (staged and restart both bind Modbus
#                        1502; three put WPF windows on the one desktop), each behind l2.yml real-rig's commit guard,
#                        the start deadline and a free-disk floor. A night (nightly=true) starts no runner after 07:00 CST
#                        of the morning it runs into (04:00 until control-server#807; that only kept clear of
#                        8005-mes-ingest's golden-renderer verify, which did not move to vm-win-01).
#   report  (headless)   comments the verdict on control-server#581, whatever the other two did, with when main's trigger
#                        was planned, when GitHub fired it and how late, when the round started and how long it queued
#                        for cs-desktop, and the deadline (control-server#807).
# Nothing here cancels a job, and no job's timeout is meant to be what ends it (a cancel can wedge a self-hosted
# runner: workspace CLAUDE.md). The verdict is decided offline-testably in scripts/NightlyG3.psm1, checked by
# scripts/Test-NightlyG3.ps1 in test.yml.
#
# The night is started from main. GitHub runs `schedule` only from the workflow files on the default branch (main), and
# this line (fp/v2-impl) never merges into main, so a schedule here would never fire and there is none. Instead main
# carries .github/workflows/g3-nightly-trigger.yml (control-server PR #592, the user's choice on 2026-10-11), which at
# 14:37 UTC (22:37 CST, control-server#807) dispatches this workflow on fp/v2-impl with nightly=true. That input, not the
# event name, is what makes a run a night: the 07:00 CST start deadline and the 定时触发 label in the comment. The trigger
# also passes trigger_cron and triggered_at, so the comment says how late GitHub fired it. Both are optional, and this
# file declares them before main's trigger sends them: an input it does not declare makes GitHub refuse the dispatch.
#
# By hand, on any branch that has this file (the input picks what is tested; the workflow file comes from --ref):
#   gh workflow run g3.yml -R trytoreachpeak0/8005-agv-control-server --ref fp/v2-impl -f ref=fp/v2-impl [-f note=...]
# (leave nightly false by hand: a manual round is bounded by its own 180 minutes and labelled 手动触发)
on:
  workflow_dispatch:
    inputs:
      nightly:
        description: 'true only from main''s g3-nightly-trigger.yml: the 07:00 CST start deadline and the nightly label'
        type: boolean
        default: false
      ref:
        description: 'control-server branch or commit to test; the runners clone this commit with -SelfCheckControlServerCommit'
        type: string
        default: 'fp/v2-impl'
      note:
        description: 'One line added to the comment (for example: red evidence on a throwaway branch)'
        type: string
        default: ''
      trigger_cron:
        description: 'Only from main''s g3-nightly-trigger.yml: the cron it fired for, so the comment can say how late'
        type: string
        default: ''
      triggered_at:
        description: 'Only from main''s g3-nightly-trigger.yml: when GitHub created its run (ISO 8601)'
        type: string
        default: ''
      comment_issue:
        description: 'Issue the verdict is commented on'
        type: string
        default: '581'
  # Only so that GitHub knows this workflow at all: a workflow file that is not on the default branch can be dispatched
  # only once it has run for some event. A pull request touching this file runs the `register` job and nothing else.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['.github/workflows/g3.yml']

permissions:
  contents: read
  issues: write

# One night at a time. cancel-in-progress stays false (workspace CLAUDE.md: never cancel a running self-hosted job).
concurrency:
  group: ${{ github.workflow }}${{ github.event_name == 'pull_request' && format('-pr-{0}', github.ref) || '' }}
  cancel-in-progress: false

env:
  G3_REF: ${{ inputs.ref || 'fp/v2-impl' }}
  G3_ONBOARD_REF: refs/heads/w2g/fp-v2-impl
  # A night runs from G3_NIGHT_START_HOUR_CST to the same hour the next day and starts no runner after
  # G3_DEADLINE_HOUR_CST of the morning it runs into (control-server#807). Here once, so that the gate's deadline and the
  # report's night name cannot disagree (review S4 of PR #817).
  G3_NIGHT_START_HOUR_CST: '19'
  G3_DEADLINE_HOUR_CST: '7'

jobs:
  register:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: [self-hosted, headless]
    timeout-minutes: 10
    steps:
      - name: Registration only
        shell: pwsh
        run: Write-Host 'g3.yml runs on workflow_dispatch (nightly from main''s g3-nightly-trigger.yml); a pull request touching it only registers the workflow.'

  gate:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, headless]
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      stopped_by: ${{ steps.gate.outputs.stopped_by }}
      control_server: ${{ steps.gate.outputs.control_server }}
      onboard: ${{ steps.gate.outputs.onboard }}
      started: ${{ steps.gate.outputs.started }}
      deadline: ${{ steps.gate.outputs.deadline }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.G3_REF }}
          sparse-checkout: scripts

      - name: Commits and deadline
        id: gate
        shell: pwsh
        env:
          G3_NIGHTLY: ${{ inputs.nightly }}
        run: |
          Import-Module ./scripts/NightlyG3.psm1 -Force
          $started = [DateTimeOffset]::UtcNow
          # A night arrives as a workflow_dispatch from main's trigger; nightly=true grades it as the schedule it stands for.
          $kind = if ($env:G3_NIGHTLY -eq 'true') { 'schedule' } else { $env:GITHUB_EVENT_NAME }
          $deadline = Get-NightlyG3StartDeadline -EventName $kind -StartedAtUtc $started `
              -NightStartHourCst $env:G3_NIGHT_START_HOUR_CST -DeadlineHourCst $env:G3_DEADLINE_HOUR_CST
          $controlServer = (git rev-parse HEAD).Trim()
          $onboard = ((git ls-remote https://github.com/trytoreachpeak0/8005-agv-onboard-hmi.git $env:G3_ONBOARD_REF) -split '\s+')[0]
          if ($onboard -notmatch '^[0-9a-f]{40}$') { throw "Unable to read the tip of $env:G3_ONBOARD_REF in 8005-agv-onboard-hmi: '$onboard'" }
          Write-Host "control-server $controlServer ($env:G3_REF); onboard-hmi $onboard ($env:G3_ONBOARD_REF); start deadline $($deadline.ToString('o'))"

          # Past the deadline already (GitHub fired the trigger too late): no round is queued at all.
          $stoppedBy = if ([DateTimeOffset]::UtcNow -gt $deadline) { 'NOT_STARTED_DEADLINE' } else { '' }
          @(
              "proceed=$(if ($stoppedBy) { 'false' } else { 'true' })"
              "stopped_by=$stoppedBy"
              "control_server=$controlServer"
              "onboard=$onboard"
              "started=$($started.ToString('o'))"
              "deadline=$($deadline.ToString('o'))"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  g3:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: [self-hosted, cs-desktop]
    # A round is about 45 minutes; each runner may also wait 30 for memory and 30 for the desktop lock. The round stops
    # starting runners at its deadline and fails on its own; this only has to sit above one worst-case runner past it.
    timeout-minutes: 330
    env:
      NuGetAudit: 'false'
      # As in l2.yml's real-rig job: no build server outlives the build. The runners set the first two themselves.
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'
    outputs:
      results: ${{ steps.round.outputs.results }}
      round_started: ${{ steps.start.outputs.started }}
    steps:
      - name: Round start
        id: start
        shell: pwsh
        # This job queues for cs-desktop behind the CI real rig; when it got the runner is what the comment calls 本轮开始.
        run: |
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The whole history: the runners clone the ControlServer from this local checkout (New-ExactClone), and the staged
      # harness reads its own identity from it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.control_server }}
          fetch-depth: 0

      # run-staged-g3.ps1 runs the protocol's G1 with node and pnpm. vm01 has both machine-wide (C:\Program Files\nodejs,
      # node v24.20.0 and pnpm 11.25.0 on 2026-10-11), the same installation 8005-agv-protocol's own g1.yml uses; the
      # protocol repository pins no packageManager. Nothing is installed here: missing, this fails before any runner.
      - name: Node and pnpm
        shell: pwsh
        run: |
          foreach ($name in 'node', 'pnpm') {
              $command = Get-Command $name -ErrorAction SilentlyContinue
              if ($null -eq $command) { throw "$name is not on PATH; run-staged-g3.ps1 needs it for protocol G1." }
              Write-Host "$name $(& $name --version) at $($command.Source)"
          }

      # Crash dialogs already up before the round, so the cleanup after it only blames this one (as l2.yml real-rig does).
      - name: Crash dialogs before the round
        shell: pwsh
        run: |
          $before = @(Get-Process WerFault -ErrorAction SilentlyContinue | ForEach-Object Id) -join ','
          "G3_WER_BEFORE=$before" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the four G3 runners
        id: round
        shell: pwsh
        env:
          G3_CONTROL_SERVER: ${{ needs.gate.outputs.control_server }}
          G3_ONBOARD: ${{ needs.gate.outputs.onboard }}
          G3_DEADLINE: ${{ needs.gate.outputs.deadline }}
        run: |
          # Short: the onboard clone carries G2 evidence deep enough to pass MAX_PATH below a long root.
          $work = Join-Path $env:RUNNER_TEMP 'g3'
          "G3_WORK_ROOT=$work" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & pwsh -NoProfile -File ./scripts/Invoke-NightlyG3.ps1 -WorkRoot $work -ControlServerCommit $env:G3_CONTROL_SERVER `
              -OnboardCommit $env:G3_ONBOARD -StartDeadlineUtc $env:G3_DEADLINE
          $exitCode = $LASTEXITCODE
          $resultsPath = Join-Path $work 'results.json'
          if (Test-Path -LiteralPath $resultsPath) {
              $compact = Get-Content -Raw -LiteralPath $resultsPath | ConvertFrom-Json | ConvertTo-Json -Depth 8 -Compress
              "results=$compact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          exit $exitCode

      # What the round left behind, as l2.yml's real-rig job checks (review E of PR #591). This desktop renders golden
      # baselines (8005-mes-ingest's verify near 05:30), so a leftover onboard or simulator window, an orphaned server or
      # double, or a crash dialog of ours is a defect: listed, closed, and the job fails, which keeps the night's comment
      # from reading 全绿. Ours means started from this job's own directories -- the work root and the checkout -- by
      # executable path or by command line (review 2-2 of PR #591: staged, restart and demand-bearing start `dotnet <dll>`,
      # whose path is dotnet.exe's and whose dll is only on the command line), and crash dialogs raised for such a process
      # since the round began. Decided by Select-NightlyG3LeftoverProcess, which Test-NightlyG3.ps1 checks. The L2 peer
      # cache is not ours: no G3 runner uses it (journey's peers are under its stage), and a hand-run L2 might.
      - name: Leftover processes and crash dialogs
        if: always()
        shell: pwsh
        run: |
          Import-Module ./scripts/NightlyG3.psm1 -Force
          $werBefore = @($env:G3_WER_BEFORE -split ',' | Where-Object { $_ } | ForEach-Object { [int]$_ })
          $processes = @(Get-CimInstance Win32_Process | Select-Object ProcessId, Name, ExecutablePath, CommandLine)
          $leftovers = @(Select-NightlyG3LeftoverProcess -Processes $processes -WerBefore $werBefore -ExcludeProcessId $PID `
              -OwnRoots @((Join-Path $env:RUNNER_TEMP 'g3'), $env:GITHUB_WORKSPACE))
          foreach ($leftover in $leftovers) {
              Write-Host "::error title=Leftover process::$($leftover.Name) (pid $($leftover.ProcessId)): $($leftover.Reason)"
              Stop-Process -Id $leftover.ProcessId -Force -ErrorAction SilentlyContinue
          }
          if ($leftovers.Count -gt 0) { exit 1 }
          Write-Host 'No leftover process or crash dialog of this round.'

      # Evidence of every runner, and what is left of a red runner's stage (runtime, journals, logs; its clones and
      # builds are already gone). Diagnostic material, not a deliverable, so a failed upload does not turn the run red.
      - name: Upload G3 evidence
        if: always() && env.G3_WORK_ROOT != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: g3-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.G3_WORK_ROOT }}
          retention-days: 14
          if-no-files-found: warn

      # vm01's C: had 7.9 GB free on 2026-10-11. After the upload, not before.
      - name: Remove the work root
        if: always() && env.G3_WORK_ROOT != ''
        continue-on-error: true
        shell: pwsh
        # Said, not swallowed (review E of PR #591): a work root left behind is gigabytes on a disk that has run short.
        run: |
          try {
              Remove-Item -LiteralPath $env:G3_WORK_ROOT -Recurse -Force -ErrorAction Stop
              Write-Host "Removed $env:G3_WORK_ROOT"
          } catch {
              $left = @(Get-ChildItem -LiteralPath $env:G3_WORK_ROOT -Recurse -Force -File -ErrorAction Ignore)
              $gib = [Math]::Round((($left | Measure-Object Length -Sum).Sum) / 1GB, 2)
              Write-Host "::warning title=Work root not removed::$env:G3_WORK_ROOT keeps $($left.Count) files, $gib GiB: $($_.Exception.Message)"
              "Work root not removed: $env:G3_WORK_ROOT keeps $($left.Count) files, $gib GiB." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              exit 1
          }

  report:
    needs: [gate, g3]
    if: always() && github.event_name != 'pull_request'
    runs-on: [self-hosted, headless]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.control_server || env.G3_REF }}
          sparse-checkout: scripts

      - name: Comment the verdict
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          G3_RESULTS: ${{ needs.g3.outputs.results }}
          G3_GATE_RESULT: ${{ needs.gate.result }}
          G3_JOB_RESULT: ${{ needs.g3.result }}
          G3_STOPPED_BY: ${{ needs.gate.outputs.stopped_by }}
          G3_CONTROL_SERVER: ${{ needs.gate.outputs.control_server }}
          G3_ONBOARD: ${{ needs.gate.outputs.onboard }}
          G3_STARTED: ${{ needs.gate.outputs.started }}
          G3_ROUND_STARTED: ${{ needs.g3.outputs.round_started }}
          G3_DEADLINE: ${{ needs.gate.outputs.deadline }}
          G3_TRIGGER_CRON: ${{ inputs.trigger_cron }}
          G3_TRIGGERED_AT: ${{ inputs.triggered_at }}
          G3_NOTE: ${{ inputs.note }}
          G3_NIGHTLY: ${{ inputs.nightly }}
          G3_ISSUE: ${{ inputs.comment_issue || '581' }}
        run: |
          Import-Module ./scripts/NightlyG3.psm1 -Force
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = @($env:G3_NOTE | Where-Object { $_ })
          $verdicts = @()
          $stoppedBy = $env:G3_STOPPED_BY
          $commits = [ordered]@{ controlServer = $env:G3_CONTROL_SERVER; onboardHmi = $env:G3_ONBOARD }
          if ($env:G3_RESULTS) {
              $results = $env:G3_RESULTS | ConvertFrom-Json -AsHashtable
              $verdicts = @($results['verdicts'] | ForEach-Object { [pscustomobject]$_ })
              if ($results['stoppedBy']) { $stoppedBy = $results['stoppedBy'] }
              $commits = $results['commits']
          } elseif (-not $stoppedBy) {
              # Neither a verdict nor a reason it did not start: a job that failed outside the round.
              $stoppedBy = "ERROR_NO_RESULTS (gate $env:G3_GATE_RESULT, g3 $env:G3_JOB_RESULT)"
          }
          $started = if ($env:G3_STARTED) { [DateTimeOffset]::Parse($env:G3_STARTED) } else { [DateTimeOffset]::UtcNow }
          $kind = if ($env:G3_NIGHTLY -eq 'true') { 'schedule' } else { $env:GITHUB_EVENT_NAME }
          # All optional: one that is empty or does not parse leaves its part out (the lateness, the deadline, the round's start), never the comment.
          $triggeredAt = $deadline = $roundStarted = $null
          $parsed = [DateTimeOffset]::MinValue
          $styles = [Globalization.DateTimeStyles]::AssumeUniversal
          if ([DateTimeOffset]::TryParse($env:G3_TRIGGERED_AT, [cultureinfo]::InvariantCulture, $styles, [ref]$parsed)) { $triggeredAt = $parsed }
          if ([DateTimeOffset]::TryParse($env:G3_DEADLINE, [cultureinfo]::InvariantCulture, $styles, [ref]$parsed)) { $deadline = $parsed }
          if ([DateTimeOffset]::TryParse($env:G3_ROUND_STARTED, [cultureinfo]::InvariantCulture, $styles, [ref]$parsed)) { $roundStarted = $parsed }
          $body = Format-NightlyG3Comment -Verdicts $verdicts -RunUrl $runUrl -Trigger $kind -Ref $env:G3_REF `
              -Commits $commits -StartedAtUtc $started -StoppedBy $stoppedBy -Note ($notes -join ' ') -JobResult $env:G3_JOB_RESULT `
              -TriggerCron $env:G3_TRIGGER_CRON -TriggeredAtUtc $triggeredAt -DeadlineUtc $deadline -NightStartHourCst $env:G3_NIGHT_START_HOUR_CST `
              -RoundStartedAtUtc $roundStarted
          $body | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $comment = Send-NightlyG3Comment -Repository $env:GITHUB_REPOSITORY -Issue ([int]$env:G3_ISSUE) -Body $body -Token $env:GH_TOKEN
          Write-Host "Commented: $($comment.html_url)"
