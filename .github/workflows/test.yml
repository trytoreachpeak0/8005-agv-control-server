name: test

# Runs on vm-win-01 (a Hyper-V guest on the control laptop since 2026-10-20; win11-01 before), on the two runners
# that carry 'cs-test': vmwin01-control-server-2 and, since control-server#820, vmwin01-control-server-3, so test
# jobs of two refs run side by side. This workspace does not use GitHub-hosted runners; see the workspace root
# CLAUDE.md for why.
#
# Neither carries 'headless' (release.yml, g3.yml's short jobs) or 'cs-l2' (l2.yml's scenarios), so test and l2 never
# take each other's runner. Two test jobs on one machine share the NETWORK SERVICE profile: what this job writes is
# per checkout, per run or GUID-named, and the one self-check with fixed ports and port locks, Test-G3RunnerPorts.ps1,
# queues on a machine-wide lock of its own (control-server#820). If both cs-test runners are ever gone or wedged,
# switching the runs-on line below to [self-hosted, headless] puts the job back on a runner.
on:
  push:
    # fp/v2-impl since control-server#803 (review S2 of PR #808): pull requests skip the self-checks whose inputs they do not
    # change, so the integration branch's final head runs all of them -- a skip the table got wrong, or a selector that
    # regressed, shows up there rather than on the next pull request that happens to touch the input. Only the final head:
    # merges that land while a run is going queue behind it, and a newer push replaces the one queued (it ends
    # "cancelled", before any runner takes it). On that push the self-checks run and the suite does not (the coordinator's
    # ruling on the re-review of PR #808): every pull request ran the suite on its own merge commit, and a full round here
    # would take the one cs-test runner for 22-25 minutes per merge. scripts/TestSelfCheckScope.psd1, PushToIntegration,
    # says what is skipped and what replaces it; Test-TestSelfCheckScope.ps1 holds this file to it.
    branches: [ControlServer_MVP, main, fp/v2-impl]
  # A draft pull request runs nothing; marking it ready runs the one round a ticket is meant to need.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Never cancel a running job here. Cancelling one on a self-hosted runner also
# cancels the runner's broker long-poll; the backoff retries exhaust and the
# session wedges without self-healing. Measured on 2026-09-03: 4 hours 14 minutes
# of dead CI, recovered only when GitHub pushed a RunnerRefreshConfigMessage.
# test has two runners that may take it (control-server#820), so a wedged session halves
# test throughput in this repository. A duplicate two-minute run is the cheaper outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Skipped, not cancelled: GitHub decides this before any runner is involved.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, cs-test]
    # 30 until 2026-10-02: the suite had grown to ~26 minutes of dotnet test (3960 tests) and run
    # 36921421653 (PR #437) hit the limit during artifact upload, ending "cancelled". A timeout cancel
    # is the same path as a manual cancel and can wedge the runner session, so the limit keeps headroom.
    # 45 until 2026-10-08 (control-server#521): run 37784270398 attempt 1 hit it with the Test step
    # still running 38m57s in, and was recorded "cancelled". Measured on that day's seven attempts:
    # the steps before Test take 5m47s-6m28s, upload and post-checkout about 15 s, and the Test step
    # itself 32m07s-38m05s on completed runs (attempt 2 of the same run, alone on vm01, 38m05s).
    # The Test step now carries its own limit of 60 below; that 60 + the slowest pre-Test 6m28s +
    # upload and post-checkout is about 67 minutes, and 80 leaves the rest as margin. This limit only
    # acts when something has already gone wrong, so headroom costs nothing. Adding a step before
    # Test means recomputing this number: if the job limit fires before the step's, the run is
    # "cancelled" again. Splitting the suite into two jobs buys little here: two runners
    # carry 'cs-test' (control-server#820), and the halves would take both from the next pull request.
    # 95 since control-server#567, which added two steps after Test: the v3 script-branch check (seconds) and the
    # staged content-conflict check (197 s on the control host, its own limit 15, and only on pull requests that change
    # what it checks). control-server#571 added the parallel instance self-check after Test as well (about 40 s, its own
    # limit 10), and the two merged on the same day, so the number was recomputed for both:
    #   the slowest pre-Test 6m28s (measured before #567) + the two steps #567 put before Test, 5 + 5
    #   + Test 60 + after Test 10 (#571) + 5 + 5 + 15 (#567) + upload and post-checkout about 15 s
    #   = about 112 minutes if every step ran to its own limit.
    # 120 keeps the job limit above that sum, so whatever hangs is recorded as a failed step and never as a cancelled
    # job. It only acts when something has already gone wrong.
    # Any step added later counts against it the same way.
    # 150 since control-server#583, which put nine steps before Test with their own limits, set from measurement (static
    # checks 32-40 s, the seven self-checks 1-2 s each, the SQL check 36 s plus a 26 s host build on the control host): the
    # script static checks 5, seven self-checks 2 each, the scenario SQL check 10 -- 29 more, about 141 if every step ran
    # to its own limit.
    # 160 since control-server#803, which put two steps before Test with a limit of 5 each (the self-check scope and its
    # self-check, seconds each): about 151 if every step ran to its own limit. Skipping a self-check lowers what a job
    # takes, never what it may take: a push or a dispatched run still runs every step.
    # Still 160 after the steps around the checkout (2 each) and the checkout sparse-state self-check (3), which l2 run
    # 39457961360 brought in: about 158 if every step ran to its own limit.
    timeout-minutes: 160
    env:
      # NuGet's vulnerability audit fetches its data from nuget.org during every restore, and with
      # TreatWarningsAsErrors a failed fetch (NU1900) is a red run that says nothing about the code:
      # runs 34807639494 and 35118544313. Off in CI only; release.yml keeps it.
      NuGetAudit: 'false'
      # Two jobs of this repository now build on the same machine under the same account. Without
      # this, one build may attach to MSBuild nodes the other left behind, and the runner's
      # end-of-job cleanup could kill a node the other job is still using.
      MSBUILDDISABLENODEREUSE: '1'
      # No build servers either, as in l2.yml (control-server#632, after #630 did the same there). The line above was
      # already here for a different reason, and it covers MSBuild worker nodes only: the MSBuild server and the shared
      # compiler (VBCSCompiler) outlive the build regardless. Sampled on win11-01 during run 38157565509 (2026-10-12): no
      # MSBuild node or server was left, but one VBCSCompiler started by the host build in the Scenario SQL self-check
      # and held up to 2.0 GiB private, owned by no job, until the runner killed it at job end, next to an l2 round on the
      # same machine (control-server#632's PR; the v2 workspace's ci-research/memory-budget.md). The builds here are
      # few, so a warm compiler buys little.
      # MSBuild reads UseSharedCompilation from the environment like any property, so it reaches the host build inside
      # Test-ScenarioSqlExplain.ps1 as well as the one in dotnet test.
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'

    steps:
      # Before every checkout of this repository on a self-hosted runner, and the check after it: a runner reuses one
      # directory for every job of this repository, and an earlier job's core.sparseCheckout in .git/config survives
      # actions/checkout's own git sparse-checkout disable. The checkout then leaves out most of the tree and exits 0
      # (l2 run 39457961360: ControlServer.sln missing, MSB1009). scripts/Test-CheckoutSparseState.ps1 has the story and
      # holds every workflow to the pair.
      - name: Clear sparse-checkout state an earlier job left behind
        timeout-minutes: 2
        shell: pwsh
        run: |
          $config = Join-Path $env:GITHUB_WORKSPACE ($env:CHECKOUT_PATH ?? '.') '.git/config'
          $stale = if (Test-Path -LiteralPath $config) { git config --file $config --get core.sparseCheckout }
          if ($stale) {
              Write-Host "::notice title=Sparse-checkout state cleared::core.sparseCheckout=$stale in $config, left by an earlier job"
              git config --file $config --unset-all core.sparseCheckout
              git config --file $config --unset-all core.sparseCheckoutCone
              if (git config --file $config --get core.sparseCheckout) { Write-Host "::error::core.sparseCheckout is still set in $config"; exit 1 }
          }
          exit 0

      - uses: actions/checkout@v7

      - name: Check the checkout is the tree it asked for
        timeout-minutes: 2
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath scripts/Assert-CheckoutTree.ps1) { pwsh -NoProfile -File scripts/Assert-CheckoutTree.ps1; exit $LASTEXITCODE }
          if (git ls-tree --name-only HEAD scripts/Assert-CheckoutTree.ps1) {
              Write-Host '::error title=Checkout incomplete::scripts/Assert-CheckoutTree.ps1 is in HEAD but not in the worktree'
              exit 1
          }
          Write-Host "::warning title=Checkout not checked::$(git rev-parse HEAD) predates scripts/Assert-CheckoutTree.ps1"
          exit 0

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      # control-server#803 (the user's decision on 2026-10-20): a pull request skips each self-check below whose inputs
      # it does not change. Measured over the 132 successful jobs from 2026-10-11, the self-checks before Test took a
      # median 600 s of 21m40s and the suite 477 s, while most pull requests change only src/ and tests/, which almost
      # none of the self-checks read. scripts/TestSelfCheckScope.psd1 is the one place that says what each step's inputs
      # are (its script, every file that script reaches by name, and what a name cannot show); Select-TestSelfCheckRun.ps1
      # reads it and the checkout and writes one output per step, which each step's if: reads. The steps after Test keep
      # !cancelled() beside it. A skip is a notice and the job summary lists the skipped steps, so a green job is not
      # read as "they ran". Never skipped: an event that is not a pull request (a push -- including every merge into
      # fp/v2-impl -- or a dispatched run), a diff that cannot be read, and a pull request that changes test.yml, the
      # table or the selector. The diff is the merge commit's (GITHUB_SHA) against its first parent, without rename
      # detection, as the content-conflict and L2 scopes do, and with core.quotePath off, since a quoted non-ASCII path
      # matches no input. The step ends with exit 0: a failed fetch leaves a non-zero exit code behind, and the step
      # would otherwise fail where it was meant to run everything. The staged content-conflict self-check after Test
      # keeps its own selector. A step added to this file that the table does not register turns the next step red;
      # that step is not gated on this one, because a selector that broke would otherwise skip the check that says so.
      # Seconds; the job limit's margin above covers it.
      - name: Decide which self-checks this pull request runs
        id: self-check-scope
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            $null = & ./scripts/Select-TestSelfCheckRun.ps1 -NotAPullRequest -GitHubOutput $env:GITHUB_OUTPUT
            exit 0
          }
          $changed = @()
          # git writes the unquoted path in UTF-8; pwsh would read it in the guest's zh-CN code page.
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          git fetch --no-tags --quiet --depth=2 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -eq 0) {
            $changed = @(git -c core.quotePath=false diff --no-renames --name-only "$env:GITHUB_SHA^1" $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) { $changed = @() }
          }
          if ($changed.Count -eq 0) {
            Write-Host "::warning title=Self-check scope::Could not read this pull request's changed paths; running every self-check."
          }
          $decision = & ./scripts/Select-TestSelfCheckRun.ps1 -ChangedPath $changed -GitHubOutput $env:GITHUB_OUTPUT -StepSummary $env:GITHUB_STEP_SUMMARY
          $skipped = @($decision.Steps | Where-Object { -not $_.Run })
          if ($skipped.Count -gt 0) {
            Write-Host "::notice title=Self-checks skipped::本 PR 跳过了 $($skipped.Count) 个自检，绿不代表它们通过。$($decision.Reason)"
          }
          exit 0

      # About 15 seconds, pure input: the table above covers every step of this file, and a change to a registered input
      # never skips its step (control-server#803). On every event, never gated on the scope above (review M1 of PR #808).
      - name: Self-check scope self-check (which pull requests run which self-check)
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-TestSelfCheckScope.ps1

      # A second of AST parsing, ahead of the suite. A real-onboard scenario that drives the onboard through a
      # handle taken before a restart reads exactly like "the entry was never offered", and nothing but a real-rig
      # round finds that out -- control-server#222 spent one on it. The check replays its own counterexamples, so a
      # rule that stopped working fails this step instead of going quietly green (control-server#230).
      - name: L2 scenario self-check (onboard handle after restart)
        if: steps.self-check-scope.outputs.l2_onboard_handle == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2OnboardHandleAfterRestart.ps1

      # Same reason as the step above, one step further: L2-DA-09 denies that a phrase ever appeared on the HMI,
      # and all that stands between it and a vacuous green is the count of scans that actually read the tree. If
      # rounds that failed to read start counting as looks again, that criterion goes quietly green whenever UIA
      # cannot read -- and no real-rig round finds that out, because the real-rig round is green either way
      # (control-server#204).
      - name: L2 scenario self-check (HMI phrase watch)
        if: steps.self-check-scope.outputs.l2_hmi_phrase_watch == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2HmiPhraseWatch.ps1

      # And once more, for the one piece of pwsh that has to agree with C# to be worth anything:
      # L2RouteEvidence.psm1 recomputes a journey's route evidence id so that G3-11-07 and L2-S2W-08
      # can tell the planned route from a swapped one. Nothing builds it and no C# test reads it, so
      # without this step the two copies drift apart silently -- and a drifted copy does not go
      # vacuous, it goes permanently red, on the rig, where that reads as a product fault
      # (control-server#203).
      - name: L2 scenario self-check (route evidence recompute)
        if: steps.self-check-scope.outputs.l2_route_evidence == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2RouteEvidence.ps1

      # And the real-rig run ledger, whose failure mode is the quietest of the three: a dropped line
      # leaves the runs on either side of it looking accounted for. Two real processes appending at
      # once, which is the case no real run exercises -- they are serialised by the desktop lock, so
      # an unsafe append would pass every one of them (control-server#203).
      - name: L2 scenario self-check (real-rig run ledger)
        if: steps.self-check-scope.outputs.l2_run_ledger == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2RunLedger.ps1

      # The quietest of the lot, and the one this ticket wrote by accident before catching it: a
      # scriptblock that has been through .GetNewClosure() resolves command names globally, so it
      # cannot call an unexported function of its own module -- and the failure is swallowed by
      # Wait-L2Condition's poll and re-emerges as a timeout with the missing name nowhere in it. On
      # the rig that reads as a product fault. The check re-measures the rule before applying it, so
      # a PowerShell that changed this reports a finding rather than a quiet green (control-server#203).
      - name: L2 scenario self-check (probe closures resolve)
        if: steps.self-check-scope.outputs.l2_probe_closures == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2ProbeClosureResolvable.ps1

      # Six seconds, four of which are deliberate timeouts. Wait-L2SecondLegIntent refuses to judge a
      # demand that has more than one second leg, and every journey the rig has ever run had exactly
      # one -- so no real-rig round, green or red, reaches any of this. It drives the shipped function
      # with Invoke-L2Query replaced in that module's own scope rather than a copy of the control flow:
      # the first attempt at a copy put the probe outside the module, which removed the very thing the
      # test was for, and passed on broken code (control-server#203).
      - name: L2 scenario self-check (second-leg intent wait)
        if: steps.self-check-scope.outputs.l2_second_leg_intent == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2SecondLegIntentWait.ps1

      # A few seconds, pure input. Besides the overdue threshold key it pins the raisedAt bound on the overdue alarm a
      # real-onboard scenario waits for (control-server#541): no real-rig round reaches it before the journey G3, and
      # without it g3-slot-fault-declaration's unload wait was met at once by the load's alarm.
      - name: L2 scenario self-check (expected-action overdue)
        if: steps.self-check-scope.outputs.l2_expected_action_overdue == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2ExpectedActionOverdue.ps1

      # A few seconds, no window: the order of g3-forced-mechanical-recovery's confirm step and the failure titles it watches,
      # against a stand-in onboard and the scenario's own AST (control-server#541). The journey G3 is the only run that reaches it.
      - name: L2 scenario self-check (forced recovery confirm step)
        if: steps.self-check-scope.outputs.l2_forced_recovery_confirm == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-G3ForcedRecoveryEntry.ps1

      # About ten seconds, most of them deliberate pauses, no window. The screen-state switch is off on every run CI makes,
      # so no real-rig round, green or red, would notice it starting to change the staged onboard settings or the
      # timeline when off -- or a pause point that no longer names a criterion of its scenario, which on the rig reads as
      # a run that simply had no pause (control-server#653).
      - name: L2 scenario self-check (screen-state snapshot and pauses)
        if: steps.self-check-scope.outputs.l2_screen_state == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2ScreenState.ps1

      # A few seconds (about 5 on the control host), no rig, no window, no database: the journey G3 rig's UI Automation reads
      # against a stand-in onboard and the scenarios' own AST -- sublot entry and the onboard refusals it must recognise,
      # the held readings of g3-waiting-point-idle-return (G3-12-03, G3-12-07) and g3-automatic-charging-cycle's charger
      # window (control-server#560, #567). Only the journey G3 reaches these scenarios, and only after an exit moves its
      # binding, so a fixture that regressed would otherwise surface at the next exit.
      - name: G3 scenario self-check (journey UIA fixture reads)
        if: steps.self-check-scope.outputs.g3_journey_uia_fixture == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-G3JourneyUiaFixtureReads.ps1

      # Under a second, pure input: which pull requests run the staged content-conflict self-check after Test
      # (control-server#567). A selector that stopped matching would skip that check for ever and stay green.
      - name: G3 runner self-check (content-conflict scope)
        if: steps.self-check-scope.outputs.g3_content_conflict_scope == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-StagedG3ContentConflictScope.ps1

      # About 25 seconds on the control host, most of it one pass over every tracked file outside evidence/: which pull
      # requests l2.yml's scenarios job runs the synthetic round for (control-server#630). A selector that skipped a change
      # it should have run would leave L2 silent on exactly the change that broke it, so every tracked input file must
      # count, anything unknown must count, and l2.yml must be wired to the answer.
      - name: L2 self-check (scenario round scope)
        if: steps.self-check-scope.outputs.l2_scenario_round_scope == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-L2ScenarioRunScope.ps1

      # About 30 seconds, most of it pwsh and git starting: replays on a throwaway repository the runner history that left
      # l2 run 39457961360 with half a tree, and holds every workflow to the steps around each checkout (see the first
      # steps of this job).
      - name: CI self-check (checkout sparse state)
        if: steps.self-check-scope.outputs.checkout_sparse_state == 'true'
        timeout-minutes: 3
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-CheckoutSparseState.ps1

      # About 27 seconds (measured 26.4 / 26.8 / 26.7 on the control host), 24 of which are twelve
      # deliberate 2-second timeouts: every case where a criterion must NOT be satisfied has to run out
      # its clock. The twelve is the load-bearing number, and it comes from reading the invocations.
      #
      # Two things this comment used to say and no longer does, both from review of #272. It quoted a
      # grep count of "Timed out" as the thing reading-the-invocations corrected; that count described
      # a different command than the one actually run, and a comment added in the same PR changed it
      # again -- a count of a string in a file goes stale every time someone edits a comment. And it
      # treated "one more timeout would leave no room to start" as a proof; that holds only at this
      # machine's speed (review measured the previous version up to 3 s slower, cold start slower
      # still). The overhead is a few seconds and varies; the timeout count does not.
      #
      # Covers the two waits the real rig cannot put in the states that matter. The second stop's
      # used to be "at least 2 acknowledged worklists", a proxy that equals "the second stop's
      # worklist is acknowledged" only while every stop emits exactly one; the first stop's went
      # from a count to "an acknowledged worklist WITH a station id". Each half's key case asserts
      # BOTH sides on the same input -- the old criterion satisfied, the new one not -- because
      # showing only that the new one holds would not show the old one ever failed
      # (control-server#265).
      - name: L2 scenario self-check (worklist station wait)
        if: steps.self-check-scope.outputs.l2_worklist_station_wait == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2WorklistStationWait.ps1

      # A few seconds against a real loopback listener. When a double refuses a command, the reason
      # is in the response body, and pwsh keeps that body out of the exception message the
      # orchestrator writes into the evidence -- so a refusal used to arrive there as a bare
      # "409 (Conflict)". control-server#277 got two such reds and could not say what had failed.
      # Nothing green ever reaches that path, so no scenario notices it quietly breaking again.
      - name: L2 scenario self-check (double command refusal body)
        if: steps.self-check-scope.outputs.l2_double_command_error == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2DoubleCommandError.ps1

      # Under a second, no rig. The two loading-phase readers skip a journey's closure business state by its
      # messageId and still throw on any other business state without a loadingPhase (control-server#323,
      # PR #329 review). That messageId is derived twice, by the server and by CargoHoldingCommon.ps1; this
      # pins the script side to the vector JourneyClosureSnapshotTests pins on the server side.
      - name: L2 scenario self-check (journey closure ids)
        if: steps.self-check-scope.outputs.l2_journey_closure_ids == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2JourneyClosureIds.ps1

      # Under a second, no rig. The plan-leg row parsing the two batch-7 real-rig scenarios read the HMI with
      # (control-server#218). Its fallback once carried a regex word boundary that an editing tool decoded into a
      # literal backspace: it parsed, matched nothing, and a whole real-rig session read every plan row as '?'.
      # Only a real-onboard run reaches that code, and CI's synthetic lanes never do.
      - name: L2 scenario self-check (multi-stop plan row parsing)
        if: steps.self-check-scope.outputs.l2_multi_stop_plan_rows == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2MultiStopJourney.ps1

      # A few seconds against a real loopback listener, no rig. run-staged-g3.ps1's error path: only an errored
      # run reaches it, and on 2026-09-22 it replaced such a run's own error with an IndexOf on $null and kept
      # a refused activation's reason out of the evidence (control-server#306).
      - name: G3 runner self-check (staged error path)
        if: steps.self-check-scope.outputs.g3_staged_error_path == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-StagedG3ErrorPath.ps1

      # About ten seconds, no rig. G3 evidence must not claim more than its run tested (control-server#460):
      # a self-check override grades formalSlicePass false in all four runners, an errored demand-bearing run
      # writes its own cause before the gate-result writer's refusal, and -FieldRunRoot refuses a store the
      # synthetic rig wrote. No green G3 run reaches any of the three.
      - name: G3 runner self-check (evidence honesty)
        if: steps.self-check-scope.outputs.g3_evidence_honesty == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3EvidenceHonesty.ps1

      # A second or two, no rig. The staged and restart runners' -SelfCheck*Commit parameters (control-server#582),
      # which the nightly g3.yml runs them with: an override is used and recorded SELF_CHECK_OVERRIDE, withholding the
      # formal pass, and without one the written binding is what the run uses. Only the nightly run takes this path.
      - name: G3 runner self-check (self-check override parameters)
        if: steps.self-check-scope.outputs.g3_self_check_override == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3SelfCheckOverride.ps1

      # Under a minute, no rig. What the nightly g3.yml decides (control-server#582): a runner's verdict from its exit
      # code and run-result.json, the comment on control-server#581 (全绿 only for a complete, successful round), the
      # wait for the CI real rig, the start deadline, a round of Invoke-NightlyG3.ps1 against stand-in runners
      # (gates, cleanup, an exception mid-round), and the workflow lines that must not drift. Nothing of it runs by day.
      - name: G3 runner self-check (nightly G3 decisions)
        if: steps.self-check-scope.outputs.g3_nightly_decisions == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-NightlyG3.ps1

      # Seconds, no rig: the runners' stage handling (control-server#585). Each runner's own New-ExactClone against a
      # throwaway repository: the ControlServer clone leaves evidence/ out and its HEAD, clean and remote-ref
      # assertions still go red; the journey builds once and starts every scenario with -SkipBuild; the -MinFreeGiB
      # floor before the stage; a passed run's stage removed, a red one's kept. No G3 run is short enough to show these.
      - name: G3 runner self-check (stage, clone and disk)
        if: steps.self-check-scope.outputs.g3_runner_stage == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3RunnerStage.ps1

      # Seconds, no rig, no desktop: the staged, restart and shadow runners' ports (control-server#809). The port
      # parameters and where they flow (the simulator's settings beside its binary, the onboard's IO module, the health
      # URLs); G3RunnerPorts.psm1 against real mutexes and real listeners on 39001-39099 -- the per-port locks in
      # ascending order, an abandoned one taken, the L2 slot range refused, a held port named by pid and path where the
      # old health wait took it for the simulator; and the shadow runner's finally releasing its desktop lock.
      - name: G3 runner self-check (ports, port locks and owner checks)
        if: steps.self-check-scope.outputs.g3_runner_ports == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3RunnerPorts.ps1

      # About three minutes, no rig, no elevation, nothing outside %TEMP%: four cases wait out the scripts' real
      # 30-second limit. Install-ControlServerLocal.ps1 and Update-ControlServerLocal.ps1 run end to end against
      # stubs, and must neither copy nor delete a data root a live Host still holds (its <db>.instance-lock), nor
      # empty one they could not back up (control-server#503). Only a failed install or upgrade reaches most of
      # this, and the deployments that would find out run on the plant's servers.
      - name: Install and upgrade self-check (data root lock wait)
        if: steps.self-check-scope.outputs.install_data_root_lock_wait == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-DataRootLockWait.ps1

      # About 40 seconds, no rig, no elevation: both product scripts end to end against stubs and a loopback double of the
      # Host (control-server#649). The upgrade's safety projection check reads a two-car instance with each vehicle's own
      # credential, refuses a shared or crossed one with a reason code, and leaves a single car as it was; a first install
      # whose first readiness read is already ready (no reason) completes. Only a deployment on factory01 reaches either.
      - name: Install and upgrade self-check (two-car safety projection, first readiness)
        if: steps.self-check-scope.outputs.install_two_car_paths == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-InstallerTwoCarPaths.ps1

      # 1.5 seconds, and the only thing that ever executes Get-G3EvidenceLocationDiagnostic: a G3
      # runner calls it after it has already decided it found nothing, so no green run reaches it.
      # It says WHERE nothing was found, which is what control-server#211 needed and did not have --
      # its scenarios directory existed and was empty, because the children had written elsewhere,
      # and the runner reported that as a protocol fault (control-server#264).
      - name: G3 runner self-check (evidence location diagnostic)
        if: steps.self-check-scope.outputs.g3_evidence_location == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3EvidenceLocation.ps1

      # About 12 seconds, most of it scanning the 123 scripts. It is the other half of the
      # "probe closures resolve" step further up (they are not adjacent): that one catches a closure
      # whose COMMAND names do not resolve, this one a closure whose VARIABLES come back $null. Both
      # surface as a criterion that can never be satisfied, so neither is redundant
      # (control-server#266).
      #
      # It is two-sided on purpose, and both sides have now caught something. An early version flagged
      # 0 of the repository's 23 working sites AND 0 of 3 broken fixtures -- and the 0-of-23 on its own
      # read as success. Review then found the opposite failure: the guard flagged every $global: read,
      # which is a false positive by construction, and no fixture could have caught it because every
      # qualified-read fixture used $script:.
      - name: L2 scenario self-check (closure variable capture)
        if: steps.self-check-scope.outputs.l2_closure_capture == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2ClosureCapture.ps1

      # A few seconds, pure parsing plus a handful of in-process fixture runs. Invoke-L2Query and over a hundred other
      # readers under scripts/ end in `return , $rows`; written as `@(Invoke-L2Query ...)` the caller holds ONE
      # element that is the whole result, so `.Count -eq 1` is true for zero rows and for forty, and an empty
      # result throws on the first property read. It was fixed six times one site at a time before
      # control-server#428 found 35 more in 14 files -- ten of them in real-rig and G3 scenarios, which this workflow
      # never runs, so only a scan can hold the line there. The helpers are derived from the scripts, not
      # listed, and every shape the scan judges is also measured at runtime, so a rule that stopped matching
      # fails this step rather than reporting zero findings for ever.
      - name: L2 scenario self-check (whole-array readers not enumerated)
        if: steps.self-check-scope.outputs.l2_whole_array_return == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2WholeArrayReturn.ps1

      # Under a second, no rig and no SQLite. Read-L2SingleRow is what the "one journey per demand" reads go through
      # since control-server#428: one row is the row, none is $null, several is a stand-in whose every column reads
      # "(N rows, expected 1)" so the criterion built on it goes red and says why. Every scenario that uses it runs on
      # a product that gives exactly one row, so no run on any rig ever reaches the two branches it exists for.
      - name: L2 scenario self-check (single-row read)
        if: steps.self-check-scope.outputs.l2_single_row == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2SingleRow.ps1

      # control-server#730. Under a second, no rig and no SQLite. Read-L2BacklogAcceptance judges "the dispatch round
      # accepted this demand" on AcceptedAt, which later rounds leave alone, instead of on a ReasonCode they overwrite
      # with DEMAND_ALREADY_ACCEPTED. A green run on any rig almost never reaches its red branches (not accepted,
      # AcceptedAt missing or not this acceptance's, another code), so they are pinned here.
      - name: L2 scenario self-check (backlog acceptance)
        if: steps.self-check-scope.outputs.l2_backlog_acceptance == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2BacklogAcceptance.ps1

      # control-server#583. Three static checks over every script under scripts/, pure parsing, no rig: every file
      # parses with ParseFile (an AST check built on ParseInput keeps passing on a file that does not parse at all,
      # control-server#472); a property read off a listed helper's [pscustomobject] literal that the literal lacks; and
      # a $null test on a reader that folds a NULL column into '' (Get-G3Scalar). The batch-8 exit lost about 1.6 hours
      # to the last two (bc22cfd25, control-server#555): both scripts were G3-only and nothing ran them by day. Each check
      # replays its own fixtures first and asserts how much it read, so a scan that broke cannot report zero findings.
      - name: Script static checks (parse, helper properties, string-null)
        if: steps.self-check-scope.outputs.script_static_checks == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ScriptStaticChecks.ps1

      # control-server#583: seven self-checks that existed but no workflow ran. Each is pure input -- no window, no fixed
      # port, no rig, no elevation -- and takes seconds. The five control-server#583 left out are listed in its pull
      # request with the reason for each (they take the machine-wide desktop or port lock, start real orchestrators,
      # register a SYSTEM task, or already run in l2.yml).
      - name: G3 runner self-check (runner claims)
        if: steps.self-check-scope.outputs.g3_runner_claims == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3RunnerClaims.ps1

      - name: L2 scenario self-check (dispatch zone parameters)
        if: steps.self-check-scope.outputs.l2_dispatch_zone_parameters == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2DispatchZoneParameters.ps1

      - name: L2 scenario self-check (CI lane plan)
        if: steps.self-check-scope.outputs.l2_lanes == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2Lanes.ps1

      - name: L2 scenario self-check (real inbound reads)
        if: steps.self-check-scope.outputs.l2_real_inbound == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2RealInbound.ps1

      - name: L2 scenario self-check (session continuity verdict)
        if: steps.self-check-scope.outputs.l2_session_continuity == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2SessionContinuity.ps1

      - name: L2 scenario self-check (slot groups)
        if: steps.self-check-scope.outputs.l2_slot_groups == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2SlotGroups.ps1

      - name: L2 scenario self-check (task type stations)
        if: steps.self-check-scope.outputs.l2_task_type_stations == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2TaskTypeStations.ps1

      # control-server#810. Two pwsh processes publish the same peer commit into the same cache through
      # Get-L2PeerPublish, with a stand-in build held mid-way: the second queues on the per-commit lock and reuses the
      # first one's publish, a failed or killed build leaves nothing half-built, a waiter that times out touches
      # nothing. git and pwsh only, under %TEMP%: no dotnet, no window, no fixed port, no rig. About 30 s on the laptop.
      - name: L2 scenario self-check (peer publish cache concurrency)
        if: steps.self-check-scope.outputs.l2_peer_publish_cache == 'true'
        timeout-minutes: 3
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-L2PeerPublishCache.ps1

      # control-server#627. The no-build half of control-server#544's self-check: section 0 hands hand-seeded baselines
      # to run-demand-bearing-g3-vectors.ps1's Get-ExpectedClaimRecordCount (taken from its AST) and asserts the
      # hand-computed backfill parts, so getting the migration's step order wrong turns it red; section 3 runs the
      # runner's judgement statements and evidence-record checks over made-up counts. -SkipStores leaves out sections
      # 1 and 2, which build ControlServer.Host and run dotnet ef about eight times; those stay a laptop run. Pure
      # input like the seven above: no build, no window, no fixed port, no rig. About 4 s on the laptop.
      - name: G3 runner self-check (demand-bearing claim record backfill)
        if: steps.self-check-scope.outputs.g3_claim_record_backfill == 'true'
        timeout-minutes: 2
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-DemandBearingClaimRecordBackfill.ps1 -SkipStores

      # control-server#583. Every literal SQL statement the L2 and G3 scripts send (through Invoke-L2Query and the readers
      # that pass their -Sql on) compiled with EXPLAIN against a database ControlServer.Host --migrate-only creates under
      # $RUNNER_TEMP (the script's work root when no -WorkRoot is given). The script builds the host first; the Test step's
      # build below then finds it up to date, so the build time is moved, not added. --migrate-only without a connection
      # string migrates the MVP production database, so before starting the host the script asserts the connection string
      # it hands over names a database under the work root, and afterwards that the production path is untouched; it
      # prints the data source it used. SQL with $ interpolation is skipped and counted (most of it): a blind spot, printed.
      - name: Scenario SQL self-check (literal SQL against the migrated schema)
        if: steps.self-check-scope.outputs.scenario_sql_explain == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ScenarioSqlExplain.ps1 -Build

      # Exit code is the contract — the guest is zh-CN and prints 已通过! not
      # Passed!, so no step here may match on English console text.
      # Not on a push to fp/v2-impl (control-server#803; see on: above): the next step builds the Host in its place.
      - name: Test
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/fp/v2-impl') }}
        shell: pwsh
        # 60 = the longest Test step seen, 38m57s (37784270398 attempt 1, unfinished when the job
        # timed out), x 1.5, rounded up. It is the step's own limit, below the job's, so a suite that
        # outgrows it is recorded as a failed step -- "failure", not "cancelled" -- and never goes down
        # the job-cancel path (control-server#521). It does NOT save the results: the step timeout
        # kills dotnet test the same way, and VSTest writes the .trx only when the run ends, so the
        # upload below finds nothing, exactly as it did on 37784270398 attempt 1 ("No files were
        # found"). Restore, build and the outbound schema check run inside this step too, but take
        # under a minute and about 30 s.
        timeout-minutes: 60
        # BelowNormal is inherited by every process this step starts (dotnet, MSBuild nodes, the
        # test host), so while an l2 job runs next to it, the scenarios get the CPU first. l2 is on
        # the critical path and has timing-sensitive scenarios; a slower test run costs nothing.
        run: |
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'BelowNormal'
          dotnet test tests/ControlServer.Tests/ControlServer.Tests.csproj -c Release --logger 'trx;LogFileName=test-results.trx'

      # Only on a push to fp/v2-impl, where the Test step does not run (control-server#803). Two self-checks below read the
      # Host build the Test step leaves in src/ControlServer.Host/bin/Release/net8.0/win-x64 (Directory.Build.props sets
      # win-x64): the journey v3 script branches, which exit 2 without it, and the parallel instance check, which skips a
      # case. This builds the same Host the same way, so they run on that push as on any other. About a minute; with Test
      # (60) skipped whenever this runs, the job limit's sum above does not grow.
      - name: Build ControlServer.Host for the self-checks that read it (push to fp/v2-impl)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/fp/v2-impl' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'BelowNormal'
          dotnet build src/ControlServer.Host/ControlServer.Host.csproj -c Release -nologo

      # control-server#571. The v2 parallel instance's offline self-check: the definition checks (agv01 never in
      # the vehicle roster, each roster row's identity against remote-ops/fleet.md), the overlay, and the
      # read-back of what the Host really bound. Nothing in it touches a machine. It was run by hand only, and
      # what is run by hand only is found broken at a batch exit. After Test, so its one case that borrows the
      # SQLite provider from a Host build finds one instead of skipping; !cancelled() so it reports even when
      # the suite is red. About 40 s on the laptop; with the step limit the job's 120 (see timeout-minutes
      # above) stays above every step's, so a hang here is a failed step, not a cancelled job.
      - name: Parallel instance self-check
        if: ${{ !cancelled() && steps.self-check-scope.outputs.parallel_instance == 'true' }}
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -NoProfile -File ./scripts/parallel/Test-ParallelInstance.ps1

      # A few seconds, no rig, no window (control-server#555, #567): the two journey G3 script branches no run reached before
      # the batch-8 exit. After Test, not with the self-checks above, because its SQLite cases borrow Microsoft.Data.Sqlite
      # from src/ControlServer.Host/bin/Release/net8.0/win-x64, which the Test step's build produces (the test project
      # references the host). Without that build it exits 2, never 0, so a skip cannot pass here. !cancelled(): it does not
      # depend on the suite's verdict, only on its build, and a red suite should not hide it. Adds seconds to the job;
      # the job limit's margin above covers it.
      - name: G3 scenario self-check (journey v3 script branches)
        if: ${{ !cancelled() && steps.self-check-scope.outputs.g3_journey_v3_branches == 'true' }}
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-G3JourneyV3ScriptBranches.ps1

      # control-server#541's content-conflict judgments in run-staged-g3.ps1, against this commit (control-server#567).
      # Not seconds: it clones this checkout, builds and publishes a ControlServer and starts it the way the staged runner
      # does, then runs the four probes that carry the judgments -- 197 s measured on the control host (cs567, -Expect Pass
      # on 0c2c27eb). Here rather than in l2.yml because l2 is the critical path and this needs no rig; here rather than in
      # a hand-dispatched job because a judgment that regressed would otherwise wait for the next exit, which is the lesson
      # of the batch-8 exit. It binds ports the system hands out, not the L2 port block, so it never meets an l2 lane's
      # slot; it takes no desktop lock and starts no window. After Test so that the two builds do not overlap in memory.
      #
      # Not on every pull request (the coordinator's ruling, 2026-10-10: this job had just come down from 36 minutes to
      # 7 1/2, and three more on every round is not worth it). A pull request runs it only when it changes what it checks;
      # Select-StagedG3ContentConflictRun.ps1 holds that list and prints why it runs or skips; a skip is also a notice and
      # a line in the job summary, so a green job is not read as "it ran". The diff is the merge commit's (GITHUB_SHA, not
      # the merge ref, which moves when the base does or the job is re-run) against its first parent, the base as GitHub
      # merged it, without rename detection, so a file moved out of a checked path still counts. Any other event -- a
      # hand-dispatched run -- runs it. A push to fp/v2-impl (control-server#803) does not: it runs the self-checks only.
      - name: Decide whether to run the staged content-conflict self-check
        id: content-conflict-scope
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Not on a push to fp/v2-impl (control-server#803; see on: above): that push runs the self-checks only, and this
          # one takes about 200 s; the coordinator's check of the integration branch's head covers it there.
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/fp/v2-impl') {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'run=false'
            Write-Host '::notice title=Staged content-conflict self-check skipped::A push to fp/v2-impl runs the self-checks only.'
            exit 0
          }
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            $null = & ./scripts/Select-StagedG3ContentConflictRun.ps1 -NotAPullRequest -GitHubOutput $env:GITHUB_OUTPUT
            exit 0
          }
          git fetch --no-tags --quiet --depth=2 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the merge commit's parents ($env:GITHUB_SHA)." }
          $changed = @(git diff --no-renames --name-only "$env:GITHUB_SHA^1" $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'git diff against the base failed.' }
          $decision = & ./scripts/Select-StagedG3ContentConflictRun.ps1 -ChangedPath $changed -GitHubOutput $env:GITHUB_OUTPUT
          if (-not $decision.Run) {
            Write-Host "::notice title=Staged content-conflict self-check skipped::$($decision.Reason)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Staged content-conflict self-check **skipped**: $($decision.Reason)"
          }

      # The stage root is short (the published tree runs deep) and unique per attempt, and is removed by the next step.
      - name: G3 runner self-check (staged content conflict)
        if: ${{ !cancelled() && steps.content-conflict-scope.outputs.run == 'true' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'BelowNormal'
          pwsh -NoProfile -File ./scripts/Test-StagedG3ContentConflict.ps1 -ControlServerCommit (git rev-parse HEAD) `
            -StageRoot "C:\ccsc-${{ github.run_id }}-${{ github.run_attempt }}" `
            -EvidenceRoot "${{ runner.temp }}\content-conflict" -Expect Pass

      - name: Remove the content-conflict stage root
        if: ${{ always() && steps.content-conflict-scope.outputs.run == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: Remove-Item -LiteralPath "C:\ccsc-${{ github.run_id }}-${{ github.run_attempt }}" -Recurse -Force -ErrorAction SilentlyContinue

      # continue-on-error, because the .trx is diagnostics, not a deliverable: the verdict is the
      # `dotnet test` exit code in the step above, already reached by the time this runs. A
      # transient ECONNRESET from the artifact service must not turn a green suite red. See the
      # workspace root CLAUDE.md, "artifact 上传的重试留着"; release.yml is deliberately strict
      # instead, because there the artifact IS the deliverable.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          # schema-conformance/ holds the verdict's detail when the outbound schema check fails the
          # run: the console only says "Test Assembly Cleanup Failure" (control-server#85). Next to
          # the test assembly, because this workflow does not set WIRE_TO_GATE_SCHEMA_REPORT_DIR --
          # test-wire-to-gate.ps1 does, and points it at the gate's evidence directory.
          path: |
            tests/ControlServer.Tests/TestResults/test-results.trx
            tests/ControlServer.Tests/bin/Release/net8.0/win-x64/schema-conformance/
            ${{ runner.temp }}/content-conflict/
          if-no-files-found: warn
