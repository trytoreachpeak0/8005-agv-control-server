name: test

# Runs on the self-hosted runner on win11-01 (factory server Hyper-V guest).
# This workspace does not use GitHub-hosted runners; see the workspace root
# CLAUDE.md for why. The 'headless' label matters — win11-01 also hosts an
# interactive runner for WPF suites, and a job that only asked for
# [self-hosted, win11-01] could be taken by either.
on:
  push:
    branches: [ControlServer_MVP, main]
  pull_request:
  workflow_dispatch:

# Never cancel a running job here. Cancelling one on a self-hosted runner also
# cancels the runner's broker long-poll; the backoff retries exhaust and the
# session wedges without self-healing. Measured on 2026-09-03: 4 hours 14 minutes
# of dead CI, recovered only when GitHub pushed a RunnerRefreshConfigMessage.
# Each repository has exactly one runner, so a wedged session is that
# repository's entire CI. A duplicate two-minute run is the cheaper outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, headless]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      # Exit code is the contract — the guest is zh-CN and prints 已通过! not
      # Passed!, so no step here may match on English console text.
      - name: Test
        shell: pwsh
        run: dotnet test tests/ControlServer.Tests/ControlServer.Tests.csproj -c Release --logger 'trx;LogFileName=test-results.trx'

      # continue-on-error because this is diagnostics, not the verdict. The step
      # above is the verdict. This runner reaches GitHub over a plant network
      # that drops connections in bursts, and on 2026-09-07 a green test suite
      # was reported as a failed run because FinalizeArtifact timed out after
      # the .trx had already been uploaded. release.yml retries instead, because
      # there the artifact is the deliverable. See issue #7.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/ControlServer.Tests/TestResults/test-results.trx
          if-no-files-found: warn
