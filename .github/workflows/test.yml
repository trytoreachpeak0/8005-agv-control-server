name: test

# Runs on win11-01 (factory server Hyper-V guest), on this repository's second
# runner, win11-01-control-server-2. This workspace does not use GitHub-hosted
# runners; see the workspace root CLAUDE.md for why.
#
# The labels split the work so that test and l2 run side by side and two l2 jobs
# never do: only the second runner carries 'cs-test', and it does NOT carry
# 'headless', which l2.yml and release.yml ask for. Two l2 jobs at once would
# queue on the same four port slots (Global\W2G-L2PortBlock-slotN) and neither
# would finish sooner. If the second runner is ever gone or wedged, switching the
# runs-on line below back to [self-hosted, headless] restores the old setup.
on:
  push:
    branches: [ControlServer_MVP, main]
  # A draft pull request runs nothing; marking it ready runs the one round a ticket is meant to need.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Never cancel a running job here. Cancelling one on a self-hosted runner also
# cancels the runner's broker long-poll; the backoff retries exhaust and the
# session wedges without self-healing. Measured on 2026-09-03: 4 hours 14 minutes
# of dead CI, recovered only when GitHub pushed a RunnerRefreshConfigMessage.
# test has exactly one runner that may take it, so a wedged session stops every
# test run in this repository. A duplicate two-minute run is the cheaper outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Skipped, not cancelled: GitHub decides this before any runner is involved.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, cs-test]
    timeout-minutes: 30
    env:
      # NuGet's vulnerability audit fetches its data from nuget.org during every restore, and with
      # TreatWarningsAsErrors a failed fetch (NU1900) is a red run that says nothing about the code:
      # runs 34807639494 and 35118544313. Off in CI only; release.yml keeps it.
      NuGetAudit: 'false'
      # Two jobs of this repository now build on the same machine under the same account. Without
      # this, one build may attach to MSBuild nodes the other left behind, and the runner's
      # end-of-job cleanup could kill a node the other job is still using.
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - uses: actions/checkout@v7

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      # Exit code is the contract — the guest is zh-CN and prints 已通过! not
      # Passed!, so no step here may match on English console text.
      - name: Test
        shell: pwsh
        # BelowNormal is inherited by every process this step starts (dotnet, MSBuild nodes, the
        # test host), so while an l2 job runs next to it, the scenarios get the CPU first. l2 is on
        # the critical path and has timing-sensitive scenarios; a slower test run costs nothing.
        run: |
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'BelowNormal'
          dotnet test tests/ControlServer.Tests/ControlServer.Tests.csproj -c Release --logger 'trx;LogFileName=test-results.trx'

      # continue-on-error, because the .trx is diagnostics, not a deliverable: the verdict is the
      # `dotnet test` exit code in the step above, already reached by the time this runs. A
      # transient ECONNRESET from the artifact service must not turn a green suite red. See the
      # workspace root CLAUDE.md, "artifact 上传的重试留着"; release.yml is deliberately strict
      # instead, because there the artifact IS the deliverable.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          # schema-conformance/ holds the verdict's detail when the outbound schema check fails the
          # run: the console only says "Test Assembly Cleanup Failure" (control-server#85). Next to
          # the test assembly, because this workflow does not set WIRE_TO_GATE_SCHEMA_REPORT_DIR --
          # test-wire-to-gate.ps1 does, and points it at the gate's evidence directory.
          path: |
            tests/ControlServer.Tests/TestResults/test-results.trx
            tests/ControlServer.Tests/bin/Release/net8.0/win-x64/schema-conformance/
          if-no-files-found: warn
