name: test

# Runs on win11-01 (factory server Hyper-V guest), on this repository's second
# runner, win11-01-control-server-2. This workspace does not use GitHub-hosted
# runners; see the workspace root CLAUDE.md for why.
#
# The labels split the work so that test and l2 run side by side and two l2 jobs
# never do: only the second runner carries 'cs-test', and it does NOT carry
# 'headless', which l2.yml and release.yml ask for. Two l2 jobs at once would
# queue on the same four port slots (Global\W2G-L2PortBlock-slotN) and neither
# would finish sooner. If the second runner is ever gone or wedged, switching the
# runs-on line below back to [self-hosted, headless] restores the old setup.
on:
  push:
    branches: [ControlServer_MVP, main]
  # A draft pull request runs nothing; marking it ready runs the one round a ticket is meant to need.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Never cancel a running job here. Cancelling one on a self-hosted runner also
# cancels the runner's broker long-poll; the backoff retries exhaust and the
# session wedges without self-healing. Measured on 2026-09-03: 4 hours 14 minutes
# of dead CI, recovered only when GitHub pushed a RunnerRefreshConfigMessage.
# test has exactly one runner that may take it, so a wedged session stops every
# test run in this repository. A duplicate two-minute run is the cheaper outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Skipped, not cancelled: GitHub decides this before any runner is involved.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, cs-test]
    # 30 until 2026-10-02: the suite had grown to ~26 minutes of dotnet test (3960 tests) and run
    # 36921421653 (PR #437) hit the limit during artifact upload, ending "cancelled". A timeout cancel
    # is the same path as a manual cancel and can wedge the runner session, so the limit keeps headroom.
    # 45 until 2026-10-08 (control-server#521): run 37784270398 attempt 1 hit it with the Test step
    # still running 38m57s in, and was recorded "cancelled". Measured on that day's seven attempts:
    # the steps before Test take 5m47s-6m28s, upload and post-checkout about 15 s, and the Test step
    # itself 32m07s-38m05s on completed runs (attempt 2 of the same run, alone on vm01, 38m05s).
    # The Test step now carries its own limit of 60 below; that 60 + the slowest pre-Test 6m28s +
    # upload and post-checkout is about 67 minutes, and 80 leaves the rest as margin. This limit only
    # acts when something has already gone wrong, so headroom costs nothing. Adding a step before
    # Test means recomputing this number: if the job limit fires before the step's, the run is
    # "cancelled" again. Splitting the suite into two jobs buys nothing here: only
    # win11-01-control-server-2 carries 'cs-test' and it runs one job at a time, so the halves would
    # queue behind each other.
    # 95 since control-server#567, which added two steps after Test: the v3 script-branch check (seconds) and the
    # staged content-conflict check (197 s on the control host, its own limit 15, and only on pull requests that change
    # what it checks). 60 + 6m28s + 15 + upload is about 82 minutes when every step runs to its own limit, which 80 no
    # longer covered.
    timeout-minutes: 95
    env:
      # NuGet's vulnerability audit fetches its data from nuget.org during every restore, and with
      # TreatWarningsAsErrors a failed fetch (NU1900) is a red run that says nothing about the code:
      # runs 34807639494 and 35118544313. Off in CI only; release.yml keeps it.
      NuGetAudit: 'false'
      # Two jobs of this repository now build on the same machine under the same account. Without
      # this, one build may attach to MSBuild nodes the other left behind, and the runner's
      # end-of-job cleanup could kill a node the other job is still using.
      MSBUILDDISABLENODEREUSE: '1'

    steps:
      - uses: actions/checkout@v7

      - name: dotnet --info
        shell: pwsh
        run: dotnet --info

      # A second of AST parsing, ahead of the suite. A real-onboard scenario that drives the onboard through a
      # handle taken before a restart reads exactly like "the entry was never offered", and nothing but a real-rig
      # round finds that out -- control-server#222 spent one on it. The check replays its own counterexamples, so a
      # rule that stopped working fails this step instead of going quietly green (control-server#230).
      - name: L2 scenario self-check (onboard handle after restart)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2OnboardHandleAfterRestart.ps1

      # Same reason as the step above, one step further: L2-DA-09 denies that a phrase ever appeared on the HMI,
      # and all that stands between it and a vacuous green is the count of scans that actually read the tree. If
      # rounds that failed to read start counting as looks again, that criterion goes quietly green whenever UIA
      # cannot read -- and no real-rig round finds that out, because the real-rig round is green either way
      # (control-server#204).
      - name: L2 scenario self-check (HMI phrase watch)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2HmiPhraseWatch.ps1

      # And once more, for the one piece of pwsh that has to agree with C# to be worth anything:
      # L2RouteEvidence.psm1 recomputes a journey's route evidence id so that G3-11-07 and L2-S2W-08
      # can tell the planned route from a swapped one. Nothing builds it and no C# test reads it, so
      # without this step the two copies drift apart silently -- and a drifted copy does not go
      # vacuous, it goes permanently red, on the rig, where that reads as a product fault
      # (control-server#203).
      - name: L2 scenario self-check (route evidence recompute)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2RouteEvidence.ps1

      # And the real-rig run ledger, whose failure mode is the quietest of the three: a dropped line
      # leaves the runs on either side of it looking accounted for. Two real processes appending at
      # once, which is the case no real run exercises -- they are serialised by the desktop lock, so
      # an unsafe append would pass every one of them (control-server#203).
      - name: L2 scenario self-check (real-rig run ledger)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2RunLedger.ps1

      # The quietest of the lot, and the one this ticket wrote by accident before catching it: a
      # scriptblock that has been through .GetNewClosure() resolves command names globally, so it
      # cannot call an unexported function of its own module -- and the failure is swallowed by
      # Wait-L2Condition's poll and re-emerges as a timeout with the missing name nowhere in it. On
      # the rig that reads as a product fault. The check re-measures the rule before applying it, so
      # a PowerShell that changed this reports a finding rather than a quiet green (control-server#203).
      - name: L2 scenario self-check (probe closures resolve)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2ProbeClosureResolvable.ps1

      # Six seconds, four of which are deliberate timeouts. Wait-L2SecondLegIntent refuses to judge a
      # demand that has more than one second leg, and every journey the rig has ever run had exactly
      # one -- so no real-rig round, green or red, reaches any of this. It drives the shipped function
      # with Invoke-L2Query replaced in that module's own scope rather than a copy of the control flow:
      # the first attempt at a copy put the probe outside the module, which removed the very thing the
      # test was for, and passed on broken code (control-server#203).
      - name: L2 scenario self-check (second-leg intent wait)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2SecondLegIntentWait.ps1

      # A few seconds, pure input. Besides the overdue threshold key it pins the raisedAt bound on the overdue alarm a
      # real-onboard scenario waits for (control-server#541): no real-rig round reaches it before the journey G3, and
      # without it g3-slot-fault-declaration's unload wait was met at once by the load's alarm.
      - name: L2 scenario self-check (expected-action overdue)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2ExpectedActionOverdue.ps1

      # A few seconds, no window: the order of g3-forced-mechanical-recovery's confirm step and the failure titles it watches,
      # against a stand-in onboard and the scenario's own AST (control-server#541). The journey G3 is the only run that reaches it.
      - name: L2 scenario self-check (forced recovery confirm step)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-G3ForcedRecoveryEntry.ps1

      # A few seconds (about 5 on the control host), no rig, no window, no database: the journey G3 rig's UI Automation reads
      # against a stand-in onboard and the scenarios' own AST -- sublot entry and the onboard refusals it must recognise,
      # the held readings of g3-waiting-point-idle-return (G3-12-03, G3-12-07) and g3-automatic-charging-cycle's charger
      # window (control-server#560, #567). Only the journey G3 reaches these scenarios, and only after an exit moves its
      # binding, so a fixture that regressed would otherwise surface at the next exit.
      - name: G3 scenario self-check (journey UIA fixture reads)
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-G3JourneyUiaFixtureReads.ps1

      # Under a second, pure input: which pull requests run the staged content-conflict self-check after Test
      # (control-server#567). A selector that stopped matching would skip that check for ever and stay green.
      - name: G3 runner self-check (content-conflict scope)
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-StagedG3ContentConflictScope.ps1

      # About 27 seconds (measured 26.4 / 26.8 / 26.7 on the control host), 24 of which are twelve
      # deliberate 2-second timeouts: every case where a criterion must NOT be satisfied has to run out
      # its clock. The twelve is the load-bearing number, and it comes from reading the invocations.
      #
      # Two things this comment used to say and no longer does, both from review of #272. It quoted a
      # grep count of "Timed out" as the thing reading-the-invocations corrected; that count described
      # a different command than the one actually run, and a comment added in the same PR changed it
      # again -- a count of a string in a file goes stale every time someone edits a comment. And it
      # treated "one more timeout would leave no room to start" as a proof; that holds only at this
      # machine's speed (review measured the previous version up to 3 s slower, cold start slower
      # still). The overhead is a few seconds and varies; the timeout count does not.
      #
      # Covers the two waits the real rig cannot put in the states that matter. The second stop's
      # used to be "at least 2 acknowledged worklists", a proxy that equals "the second stop's
      # worklist is acknowledged" only while every stop emits exactly one; the first stop's went
      # from a count to "an acknowledged worklist WITH a station id". Each half's key case asserts
      # BOTH sides on the same input -- the old criterion satisfied, the new one not -- because
      # showing only that the new one holds would not show the old one ever failed
      # (control-server#265).
      - name: L2 scenario self-check (worklist station wait)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2WorklistStationWait.ps1

      # A few seconds against a real loopback listener. When a double refuses a command, the reason
      # is in the response body, and pwsh keeps that body out of the exception message the
      # orchestrator writes into the evidence -- so a refusal used to arrive there as a bare
      # "409 (Conflict)". control-server#277 got two such reds and could not say what had failed.
      # Nothing green ever reaches that path, so no scenario notices it quietly breaking again.
      - name: L2 scenario self-check (double command refusal body)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2DoubleCommandError.ps1

      # Under a second, no rig. The two loading-phase readers skip a journey's closure business state by its
      # messageId and still throw on any other business state without a loadingPhase (control-server#323,
      # PR #329 review). That messageId is derived twice, by the server and by CargoHoldingCommon.ps1; this
      # pins the script side to the vector JourneyClosureSnapshotTests pins on the server side.
      - name: L2 scenario self-check (journey closure ids)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2JourneyClosureIds.ps1

      # Under a second, no rig. The plan-leg row parsing the two batch-7 real-rig scenarios read the HMI with
      # (control-server#218). Its fallback once carried a regex word boundary that an editing tool decoded into a
      # literal backspace: it parsed, matched nothing, and a whole real-rig session read every plan row as '?'.
      # Only a real-onboard run reaches that code, and CI's synthetic lanes never do.
      - name: L2 scenario self-check (multi-stop plan row parsing)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2MultiStopJourney.ps1

      # A few seconds against a real loopback listener, no rig. run-staged-g3.ps1's error path: only an errored
      # run reaches it, and on 2026-09-22 it replaced such a run's own error with an IndexOf on $null and kept
      # a refused activation's reason out of the evidence (control-server#306).
      - name: G3 runner self-check (staged error path)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-StagedG3ErrorPath.ps1

      # About ten seconds, no rig. G3 evidence must not claim more than its run tested (control-server#460):
      # a self-check override grades formalSlicePass false in all four runners, an errored demand-bearing run
      # writes its own cause before the gate-result writer's refusal, and -FieldRunRoot refuses a store the
      # synthetic rig wrote. No green G3 run reaches any of the three.
      - name: G3 runner self-check (evidence honesty)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3EvidenceHonesty.ps1

      # About three minutes, no rig, no elevation, nothing outside %TEMP%: four cases wait out the scripts' real
      # 30-second limit. Install-ControlServerLocal.ps1 and Update-ControlServerLocal.ps1 run end to end against
      # stubs, and must neither copy nor delete a data root a live Host still holds (its <db>.instance-lock), nor
      # empty one they could not back up (control-server#503). Only a failed install or upgrade reaches most of
      # this, and the deployments that would find out run on the plant's servers.
      - name: Install and upgrade self-check (data root lock wait)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-DataRootLockWait.ps1

      # 1.5 seconds, and the only thing that ever executes Get-G3EvidenceLocationDiagnostic: a G3
      # runner calls it after it has already decided it found nothing, so no green run reaches it.
      # It says WHERE nothing was found, which is what control-server#211 needed and did not have --
      # its scenarios directory existed and was empty, because the children had written elsewhere,
      # and the runner reported that as a protocol fault (control-server#264).
      - name: G3 runner self-check (evidence location diagnostic)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-G3EvidenceLocation.ps1

      # About 12 seconds, most of it scanning the 123 scripts. It is the other half of the
      # "probe closures resolve" step further up (they are not adjacent): that one catches a closure
      # whose COMMAND names do not resolve, this one a closure whose VARIABLES come back $null. Both
      # surface as a criterion that can never be satisfied, so neither is redundant
      # (control-server#266).
      #
      # It is two-sided on purpose, and both sides have now caught something. An early version flagged
      # 0 of the repository's 23 working sites AND 0 of 3 broken fixtures -- and the 0-of-23 on its own
      # read as success. Review then found the opposite failure: the guard flagged every $global: read,
      # which is a false positive by construction, and no fixture could have caught it because every
      # qualified-read fixture used $script:.
      - name: L2 scenario self-check (closure variable capture)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2ClosureCapture.ps1

      # A few seconds, pure parsing plus a handful of in-process fixture runs. Invoke-L2Query and over a hundred other
      # readers under scripts/ end in `return , $rows`; written as `@(Invoke-L2Query ...)` the caller holds ONE
      # element that is the whole result, so `.Count -eq 1` is true for zero rows and for forty, and an empty
      # result throws on the first property read. It was fixed six times one site at a time before
      # control-server#428 found 35 more in 14 files -- ten of them in real-rig and G3 scenarios, which this workflow
      # never runs, so only a scan can hold the line there. The helpers are derived from the scripts, not
      # listed, and every shape the scan judges is also measured at runtime, so a rule that stopped matching
      # fails this step rather than reporting zero findings for ever.
      - name: L2 scenario self-check (whole-array readers not enumerated)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2WholeArrayReturn.ps1

      # Under a second, no rig and no SQLite. Read-L2SingleRow is what the "one journey per demand" reads go through
      # since control-server#428: one row is the row, none is $null, several is a stand-in whose every column reads
      # "(N rows, expected 1)" so the criterion built on it goes red and says why. Every scenario that uses it runs on
      # a product that gives exactly one row, so no run on any rig ever reaches the two branches it exists for.
      - name: L2 scenario self-check (single-row read)
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-L2SingleRow.ps1

      # Exit code is the contract — the guest is zh-CN and prints 已通过! not
      # Passed!, so no step here may match on English console text.
      - name: Test
        shell: pwsh
        # 60 = the longest Test step seen, 38m57s (37784270398 attempt 1, unfinished when the job
        # timed out), x 1.5, rounded up. It is the step's own limit, below the job's, so a suite that
        # outgrows it is recorded as a failed step -- "failure", not "cancelled" -- and never goes down
        # the job-cancel path (control-server#521). It does NOT save the results: the step timeout
        # kills dotnet test the same way, and VSTest writes the .trx only when the run ends, so the
        # upload below finds nothing, exactly as it did on 37784270398 attempt 1 ("No files were
        # found"). Restore, build and the outbound schema check run inside this step too, but take
        # under a minute and about 30 s.
        timeout-minutes: 60
        # BelowNormal is inherited by every process this step starts (dotnet, MSBuild nodes, the
        # test host), so while an l2 job runs next to it, the scenarios get the CPU first. l2 is on
        # the critical path and has timing-sensitive scenarios; a slower test run costs nothing.
        run: |
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'BelowNormal'
          dotnet test tests/ControlServer.Tests/ControlServer.Tests.csproj -c Release --logger 'trx;LogFileName=test-results.trx'

      # A few seconds, no rig, no window (control-server#555, #567): the two journey G3 script branches no run reached before
      # the batch-8 exit. After Test, not with the self-checks above, because its SQLite cases borrow Microsoft.Data.Sqlite
      # from src/ControlServer.Host/bin/Release/net8.0/win-x64, which the Test step's build produces (the test project
      # references the host). Without that build it exits 2, never 0, so a skip cannot pass here. !cancelled(): it does not
      # depend on the suite's verdict, only on its build, and a red suite should not hide it. Adds seconds to the job;
      # the job limit's margin above covers it.
      - name: G3 scenario self-check (journey v3 script branches)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/l2/Test-G3JourneyV3ScriptBranches.ps1

      # control-server#541's content-conflict judgments in run-staged-g3.ps1, against this commit (control-server#567).
      # Not seconds: it clones this checkout, builds and publishes a ControlServer and starts it the way the staged runner
      # does, then runs the four probes that carry the judgments -- 197 s measured on the control host (cs567, -Expect Pass
      # on 0c2c27eb). Here rather than in l2.yml because l2 is the critical path and this needs no rig; here rather than in
      # a hand-dispatched job because a judgment that regressed would otherwise wait for the next exit, which is the lesson
      # of the batch-8 exit. It binds ports the system hands out, not the L2 port block, so it never meets an l2 lane's
      # slot; it takes no desktop lock and starts no window. After Test so that the two builds do not overlap in memory.
      #
      # Not on every pull request (the coordinator's ruling, 2026-10-10: this job had just come down from 36 minutes to
      # 7 1/2, and three more on every round is not worth it). A pull request runs it only when it changes what it checks;
      # Select-StagedG3ContentConflictRun.ps1 holds that list and prints why it runs or skips; a skip is also a notice and
      # a line in the job summary, so a green job is not read as "it ran". The diff is the merge commit's (GITHUB_SHA, not
      # the merge ref, which moves when the base does or the job is re-run) against its first parent, the base as GitHub
      # merged it, without rename detection, so a file moved out of a checked path still counts. Any other event -- a
      # hand-dispatched run -- runs it. This workflow does not run on a push to fp/v2-impl, so there is no automatic
      # backstop there until the nightly G3 takes this check over.
      - name: Decide whether to run the staged content-conflict self-check
        id: content-conflict-scope
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            $null = & ./scripts/Select-StagedG3ContentConflictRun.ps1 -NotAPullRequest -GitHubOutput $env:GITHUB_OUTPUT
            exit 0
          }
          git fetch --no-tags --quiet --depth=2 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the merge commit's parents ($env:GITHUB_SHA)." }
          $changed = @(git diff --no-renames --name-only "$env:GITHUB_SHA^1" $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { throw 'git diff against the base failed.' }
          $decision = & ./scripts/Select-StagedG3ContentConflictRun.ps1 -ChangedPath $changed -GitHubOutput $env:GITHUB_OUTPUT
          if (-not $decision.Run) {
            Write-Host "::notice title=Staged content-conflict self-check skipped::$($decision.Reason)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Staged content-conflict self-check **skipped**: $($decision.Reason)"
          }

      # The stage root is short (the published tree runs deep) and unique per attempt, and is removed by the next step.
      - name: G3 runner self-check (staged content conflict)
        if: ${{ !cancelled() && steps.content-conflict-scope.outputs.run == 'true' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          [System.Diagnostics.Process]::GetCurrentProcess().PriorityClass = 'BelowNormal'
          pwsh -NoProfile -File ./scripts/Test-StagedG3ContentConflict.ps1 -ControlServerCommit (git rev-parse HEAD) `
            -StageRoot "C:\ccsc-${{ github.run_id }}-${{ github.run_attempt }}" `
            -EvidenceRoot "${{ runner.temp }}\content-conflict" -Expect Pass

      - name: Remove the content-conflict stage root
        if: ${{ always() && steps.content-conflict-scope.outputs.run == 'true' }}
        continue-on-error: true
        shell: pwsh
        run: Remove-Item -LiteralPath "C:\ccsc-${{ github.run_id }}-${{ github.run_attempt }}" -Recurse -Force -ErrorAction SilentlyContinue

      # continue-on-error, because the .trx is diagnostics, not a deliverable: the verdict is the
      # `dotnet test` exit code in the step above, already reached by the time this runs. A
      # transient ECONNRESET from the artifact service must not turn a green suite red. See the
      # workspace root CLAUDE.md, "artifact 上传的重试留着"; release.yml is deliberately strict
      # instead, because there the artifact IS the deliverable.
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          # schema-conformance/ holds the verdict's detail when the outbound schema check fails the
          # run: the console only says "Test Assembly Cleanup Failure" (control-server#85). Next to
          # the test assembly, because this workflow does not set WIRE_TO_GATE_SCHEMA_REPORT_DIR --
          # test-wire-to-gate.ps1 does, and points it at the gate's evidence directory.
          path: |
            tests/ControlServer.Tests/TestResults/test-results.trx
            tests/ControlServer.Tests/bin/Release/net8.0/win-x64/schema-conformance/
            ${{ runner.temp }}/content-conflict/
          if-no-files-found: warn
