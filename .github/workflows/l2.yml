name: l2

# The L2 scenario layer: a real ControlServer against loopback doubles, driven end to end and
# asserted against the server's own database. It sits between the unit suite (one process) and the
# gates (expensive, human-scheduled), and it is the only automated layer that sees cross-end timing.
#
# Two jobs, two rigs.
#
# `scenarios` runs the SYNTHETIC scenarios, on every push and pull request and on demand. They need
# nothing from the peer repositories: Get-L2PeerPublish is only called when a scenario's setup file
# says Onboard = 'Real'. So that job is independent of the other side's progress.
#
# `real-rig` runs the REAL-ONBOARD scenarios, on demand only (`-f rig=real`), since 2026-09-19: the
# shipped onboard WPF from 8005-agv-onboard-hmi driven through UI Automation, plus the real
# slots-simulator over Modbus. It moves no vehicle. Until that day they ran only on the control
# laptop's desktop under a manually scheduled slot; the user approved moving batch exits, tip
# backstops and onboard UI regressions here (the v2 workspace's ci-research/real-rig-bottleneck.md,
# plan b). Debugging a scenario while watching it stays on the laptop.
#
#   - It needs an interactive desktop (two WPF windows appear), so it runs on
#     vmwin01-control-server-desktop on vm-win-01 (win11-01-control-server-desktop on vm01 until 2026-10-20), the
#     only runner labelled `cs-desktop`: an interactive runner in the autologon session 1, started by a logon-triggered
#     scheduled task (the workspace's remote-ops/factory-server/scripts/18-install-control-server-desktop-runner.ps1
#     installed the vm01 one). The service runners in session 0 cannot run it at all.
#   - On vm01 that desktop was also the golden WPF renderer and 8005-mes-ingest's desktop test host, which stayed there.
#     `concurrency` cannot see across repositories, so the exclusion is the machine-wide mutex
#     `Global\W2G-InteractiveDesktop`: Invoke-L2Scenario.ps1 takes it per real-onboard scenario and
#     queues up to 30 minutes (scripts/DesktopLock.psm1), and since 8005-mes-ingest#8 that
#     repository's two workflows queue for it too instead of failing fast. A collision with the
#     nightly golden-renderer verify (03:00 CST, in practice starting nearer 05:30) costs a wait,
#     not a red run; still, prefer not to start a long round in that window.
#   - Port slot 0, the one every real rig has always used; the synthetic lanes use 1..8.
#   - It pairs the server with explicit peer commits, each checked out into its own subdirectory:
#       gh workflow run l2.yml --ref <branch> -f rig=real -f onboard_ref=<sha> -f simulator_ref=<sha> \
#           [-f mode=consecutive] [-f scenarios=a,b]
on:
  push:
    branches: [ControlServer_MVP, main]
  # A draft pull request runs nothing; marking it ready runs the one round a ticket is meant to need.
  # No `edited`: changing the body -- including its L2-Consecutive line -- must not start another round.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The on-demand consecutive run: any branch, any time the runner is free. There is deliberately no
  # schedule -- a ticket that needs three in a row mid-development should not wait for the night.
  #   gh workflow run l2.yml --ref <branch> -f mode=consecutive [-f scenarios=a,b]
  workflow_dispatch:
    inputs:
      rig:
        description: 'synthetic = the scenarios job below; real = the real-onboard rig on the interactive cs-desktop runner'
        type: choice
        options: [synthetic, real]
        default: synthetic
      onboard_ref:
        description: 'rig=real only: 8005-agv-onboard-hmi commit (40-hex SHA) or branch to pair with'
        type: string
        default: 'w2g/fp-v2-impl'
      simulator_ref:
        description: 'rig=real only: slots-simulator commit (40-hex SHA) or branch to pair with'
        type: string
        default: 'main'
      batch_id:
        description: 'rig=real only: identity.batchId written into each assertions.json (a label; empty keeps the orchestrator default)'
        type: string
        default: ''
      mode:
        description: 'consecutive = each scenario its registered Runs; consecutive-all = every scenario at least three; default = what a pull request runs'
        type: choice
        options: [consecutive, consecutive-all, default]
        default: consecutive
      scenarios:
        description: 'Comma-separated scenario names to run; empty runs the whole list'
        type: string
        default: ''

# A real-rig dispatch gets its own group (suffix `-real`); push, pull request and synthetic dispatch
# keep their names. Sharing one group serialised a synthetic and a real dispatch on the same ref for no
# reason (different runners, different port slots), and let the next dispatch on that ref silently
# replace a real-rig round still pending -- a batch exit dispatches both on fp/v2-impl. Memory between
# the two is the real-rig job's own whole-machine commit guard (below), which also sees other refs and
# repositories; a repository-wide group would let pull request rounds of different tickets replace
# each other while pending.
#
# Never cancel a running job here. Cancelling one on a self-hosted runner also cancels the runner's
# broker long-poll; the backoff retries exhaust and the session wedges without self-healing.
# Measured on 2026-09-03: 4 hours 14 minutes of dead CI. Only one runner may take this job, so a
# wedged session stops every l2 run. Cancelling a QUEUED job is safe and still happens.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.rig == 'real' && '-real' || '' }}
  cancel-in-progress: false

jobs:
  scenarios:
    # Skipped, not cancelled: GitHub decides this before any runner is involved.
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.rig != 'real'
    # `cs-l2` since control-server#820: one runner on vm-win-01 carries it, vmwin01-control-server-l2, and nothing else
    # asks for it. Until then this job asked for `headless`, the label release.yml, g3.yml's register/gate/report and the
    # nightly trigger also ask for, and they queued behind a half-hour L2 round on the one runner that carries it. One
    # runner keeps two l2 jobs from ever contending for the port slots: two runners on lanes 1..8 would queue scenario by
    # scenario on the same slot locks and neither round would finish sooner (control-server#820 measured one runner with
    # eight lanes against two with four each and chose the first; its pull request has the numbers). Any label is still
    # needed: vm-win-01 also hosts an interactive runner, and a job that asked only for [self-hosted] could land there.
    # If vmwin01-control-server-l2 is ever gone or wedged, switching this line back to [self-hosted, headless] restores
    # the old setup.
    runs-on: [self-hosted, cs-l2]
    # A timeout ends the job by cancelling it, which may well take the path that wedged this runner,
    # so it must never be what ends a run. The consecutive modes, and a pull request's L2-Consecutive
    # line, run scenarios up to three times over; give them room.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 180 || 120 }}
    env:
      # NuGet's vulnerability audit fetches its data from nuget.org during every restore, and with
      # TreatWarningsAsErrors a failed fetch (NU1900) is a red run that says nothing about the code:
      # runs 34807639494 and 35118544313. Off in CI only; release.yml keeps it.
      NuGetAudit: 'false'
      L2_MODE: ${{ inputs.mode || 'default' }}
      # How many port slots the scenarios run in side by side (scripts/l2/L2Lanes.psm1, control-server#130).
      # All eight slots besides slot 0 since control-server#820. Four until then, held there by win11-01's memory (an
      # 18.5 GiB commit limit, past which an allocation fails outright rather than slowing down). On vm-win-01 (16 vCPU,
      # dynamic memory 8-32 GB, 16 GB page file) eight lanes ran the default round in 845 s against 1656 s on four, every
      # scenario passing, with the whole machine's commit peaking at 13.4 GiB while an onboard-hmi round ran beside it
      # (run 39438597483, the v2 workspace's ci-research/migration-vm-win-01-build-log.md 2.6-2.8); control-server#820's
      # pull request has the rounds measured on this file. Lower it before adding a second l2 runner, never both.
      # 1 is the old serial run, in slot 1.
      L2_LANES: '8'
      L2_ONLY: ${{ inputs.scenarios || '' }}
      L2_PR_NUMBER: ${{ github.event.pull_request.number }}
      L2_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # The body as it was when this round was triggered, read through the environment rather than
      # pasted into the script so nothing in it is ever executed.
      L2_PR_BODY: ${{ github.event.pull_request.body }}
      GITHUB_TOKEN: ${{ github.token }}
      # No build servers, as in the real-rig job below (control-server#630). This job builds once and then runs
      # scenarios for half an hour, and on 2026-10-11 the MSBuild nodes and VBCSCompiler the build left behind held
      # about 1.4 GiB of win11-01's 8 GB through the whole round (the v2 workspace's ci-research/l2-second-runner.md).
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'

    steps:
      # Before every checkout of this repository on a self-hosted runner, and the check after it: a runner reuses one
      # directory for every job of this repository, and an earlier job's core.sparseCheckout in .git/config survives
      # actions/checkout's own git sparse-checkout disable. The checkout then leaves out most of the tree and exits 0
      # (l2 run 39457961360: ControlServer.sln missing, MSB1009). scripts/Test-CheckoutSparseState.ps1 has the story and
      # holds every workflow to the pair.
      - name: Clear sparse-checkout state an earlier job left behind
        shell: pwsh
        run: |
          $config = Join-Path $env:GITHUB_WORKSPACE ($env:CHECKOUT_PATH ?? '.') '.git/config'
          $stale = if (Test-Path -LiteralPath $config) { git config --file $config --get core.sparseCheckout }
          if ($stale) {
              Write-Host "::notice title=Sparse-checkout state cleared::core.sparseCheckout=$stale in $config, left by an earlier job"
              git config --file $config --unset-all core.sparseCheckout
              git config --file $config --unset-all core.sparseCheckoutCone
              if (git config --file $config --get core.sparseCheckout) { Write-Host "::error::core.sparseCheckout is still set in $config"; exit 1 }
          }
          exit 0

      # Without evidence/ (control-server#804): about nine tenths of the repository's files, and nothing this job runs
      # reads them -- not the build, not Invoke-L2Scenario.ps1 or a module or scenario it loads (they name evidence/ only
      # in comments), not Test-L2ReadSnapshot.ps1. The scope step below diffs commits, which needs no worktree file.
      # In cone mode, every top-level directory but evidence/ listed: non-cone mode writes the core.sparseCheckout in
      # .git/config that broke later jobs (see the step above). Test-CheckoutSparseState.ps1 holds the list to the repository.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .config
            .github
            docs
            scripts
            src
            tests
            tools
            vendor

      - name: Check the checkout is the tree it asked for
        shell: pwsh
        env:
          CHECKOUT_EXCLUDE: evidence
          CHECKOUT_SPARSE: |
            .config
            .github
            docs
            scripts
            src
            tests
            tools
            vendor
        run: |
          if (Test-Path -LiteralPath scripts/Assert-CheckoutTree.ps1) { pwsh -NoProfile -File scripts/Assert-CheckoutTree.ps1; exit $LASTEXITCODE }
          if (git ls-tree --name-only HEAD scripts/Assert-CheckoutTree.ps1) {
              Write-Host '::error title=Checkout incomplete::scripts/Assert-CheckoutTree.ps1 is in HEAD but not in the worktree'
              exit 1
          }
          Write-Host "::warning title=Checkout not checked::$(git rev-parse HEAD) predates scripts/Assert-CheckoutTree.ps1"
          exit 0

      # Since control-server#630 (the user's decision on 2026-10-11): a pull request whose changes reach nothing this
      # round consumes ends the job green here, without building or running a scenario, and says so in a notice and
      # the job summary, so a green job is not read as "it ran". On 2026-10-11 8 of the 19 pull requests behind 25
      # rounds of about 30 minutes changed only tests, G3 runners, install scripts or evidence (the v2 workspace's
      # ci-research/l2-second-runner.md). Select-L2ScenarioRun.ps1 holds the rule and leans one way: a path is left
      # out only when it is known not to reach the round, anything new runs it. The job still runs and reports, so
      # it is still the ticket's one round. A push, a dispatched run and a body with an L2-Consecutive line always
      # run. The diff is the merge commit's (GITHUB_SHA) against its first parent, without rename detection, so a
      # file moved out of an input still counts -- test.yml's content-conflict scope does the same. A diff that
      # cannot be read runs the round rather than failing it: a network fault must not stand in for a verdict.
      # Its self-check runs in test.yml; it is not named here because every name in this file counts as an L2
      # input, and the self-check names the very scripts it expects to be left out.
      - name: Decide whether this pull request runs the L2 round
        id: l2-scope
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            $null = & ./scripts/l2/Select-L2ScenarioRun.ps1 -NotAPullRequest -GitHubOutput $env:GITHUB_OUTPUT
            exit 0
          }
          $changed = @()
          git fetch --no-tags --quiet --depth=2 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -eq 0) {
            $changed = @(git diff --no-renames --name-only "$env:GITHUB_SHA^1" $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) { $changed = @() }
          }
          if ($changed.Count -eq 0) {
            Write-Host "::warning title=L2 scope::Could not read this pull request's changed paths; running the round."
          }
          $decision = & ./scripts/l2/Select-L2ScenarioRun.ps1 -ChangedPath $changed -PullRequestBody $env:L2_PR_BODY -GitHubOutput $env:GITHUB_OUTPUT
          if (-not $decision.Run) {
            Write-Host "::notice title=L2 round skipped::本 PR 未运行 L2，绿不代表 L2 通过。$($decision.Reason)"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### 本 PR 未运行 L2，绿不代表 L2 通过`n`n$($decision.Reason)`n`nChanged: $(($changed | Select-Object -First 20) -join ', ')$(if ($changed.Count -gt 20) { ", ... ($($changed.Count) in all)" })"
          }

      # Every scenario runs even when an earlier one fails: one red scenario must not hide the
      # state of the others, which is the whole reason to have more than one.
      #
      # Two modes, one list. `Runs` is each scenario's CONSECUTIVE count (specification 8.3): L2
      # spans processes, so one pass cannot tell "correct" from "the scheduler happened to line up
      # this time", and a batch's scenarios must pass three in a row, each run with its own evidence
      # directory. Since 2026-09-17 that count is paid on demand, not on every push -- it was 46% of
      # an L2 job (618 of 1354 seconds in run 35171499974) on a single runner that four parallel
      # tickets queue behind:
      #
      #   default (push, pull_request)  each scenario `DefaultRuns` times, 1 when absent
      #   consecutive (dispatch)        each scenario `Runs` times
      #   consecutive-all (dispatch)    each scenario at least three times -- a batch exit
      #
      # `DefaultRuns = 3` is for a scenario that guards a race already seen red in CI, where one pass
      # on a pull request would not catch it coming back. What the default mode gives up: a
      # low-rate race in the other scenarios is now caught only by a consecutive run, so a ticket
      # touching timing (engine advance, connection session, recovery, emergency stop, or any
      # `Runs = 3` scenario) runs one before it merges.
      #
      # Since 2026-09-17 a ticket is meant to need one round, so that consecutive run goes inside it:
      # a line `L2-Consecutive: a, b` in the pull request body runs those scenarios three times each in
      # this round, the rest as default. A name not in the list fails the round -- a typo must not
      # quietly turn three runs into one.
      #
      # A pull request run whose head has moved on skips its remaining scenarios and ends green:
      # the newer push has its own run, and cancelling -- by hand or by `cancel-in-progress` -- wedges
      # this runner (see above). The check never skips a dispatched run.
      #
      # Adding a scenario: one line, `@{ Name = '...'; Runs = 1 }`, `Runs = 3` when it needs three in
      # a row. Add `DefaultRuns = 3` only for the reason above.
      #
      # Exit code is the contract -- the guest is zh-CN and the runner prints 已通过! not Passed!,
      # so nothing here may match on English console text. Invoke-L2Scenario.ps1 exits 1 on FAIL.
      - name: Run synthetic L2 scenarios
        if: steps.l2-scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $scenarios = @(
              @{ Name = 'normal-load';                 Runs = 1 }
              # Three consecutive runs since 2026-09-16, not because the scenario is new but
              # because it turned out to be racing the server: it went red once in twelve runs
              # (run 35055524167 attempt 1) on a real defect, and one pass could not have told
              # that apart from luck. See
              # docs/defects/20260916-arrival-trusted-on-a-session-row-pinned-for-one-iteration.md.
              # Three on every pull request too: that defect (control-server#104) is the race this guards.
              @{ Name = 'session-established-while-moving'; Runs = 3; DefaultRuns = 3 }
              @{ Name = 'load-result-requires-recovery';    Runs = 1 }
              @{ Name = 'load-command-never-answered';      Runs = 1 }
              @{ Name = 'route-graph-engine';          Runs = 1 }
              @{ Name = 'create-gate';                 Runs = 1 }
              # FP-C13's negative evidence: the two REQ-0302 values unapproved, and nothing built.
              @{ Name = 'create-gate-unapproved';      Runs = 1 }
              @{ Name = 'three-synthetic-peers';       Runs = 1 }
              # The batch-2 track-B exit, three consecutive runs each.
              @{ Name = 'three-vehicle-exit';          Runs = 3 }
              @{ Name = 'command-surface-order-hold';  Runs = 3 }
              @{ Name = 'route-graph-staleness';       Runs = 3 }
              # Batch 2 ticket 19's prerequisite: the emergency stop goes out exactly once. Three
              # consecutive runs, because what it guards against is a timing race with RIoT's latch.
              @{ Name = 'emergency-stop-single-trigger'; Runs = 3 }
              # control-server#63 (REQ-0356): the release on a person's confirmation, three consecutive
              # runs for the same reason -- what it guards against is RIoT clearing the latch after the
              # read-back, a timing that one pass cannot tell from luck.
              @{ Name = 'emergency-stop-operator-release'; Runs = 3 }
              # control-server#335 (REQ-0246): a door reported not locked while driving holds this order, stops once, never cancels;
              # locked again, nothing is released (CP-0011, control-server#539): a person who repaired the lock releases it.
              @{ Name = 'in-transit-door-not-locked'; Runs = 1 }
              # control-server#539 review H-1: the same with the emergency-stop button held -- recorded without a call,
              # re-triggered once a class-two entry clears the latch, then released by a person.
              @{ Name = 'in-transit-door-button-held'; Runs = 1 }
              # The batch-3 exit (FP-IS-14 and FP-IS-15), three consecutive runs each.
              @{ Name = 'slot-configuration-activation-replay'; Runs = 3; BatchId = 'batch-3' }
              @{ Name = 'onboard-alarm-snapshot-dashboard';     Runs = 3; BatchId = 'batch-3' }
              # Batch 5 (control-server#79): the station departure deadline. In CI from its own ticket so
              # a batch-4 PR catches a regression before it merges; the batch-5 exit makes it three runs.
              @{ Name = 'station-deadline-sublot-timeout'; Runs = 1; BatchId = 'batch-5' }
              # control-server#751 (REQ-0365): at the default limit 0 a demand nobody scans ends at the first station deadline
              # with a manual-carry alarm and a row on the station timeout suppression list, and is never dispatched again.
              # The name is control-server#703's, when it went back to the backlog twice first.
              @{ Name = 'station-timeout-redispatch-to-alarm'; Runs = 1 }
              # control-server#709: a STAGING_TO_WIRE pickup at its staging station has no station deadline -- nobody scans,
              # three deadlines pass, and the stop neither ends nor releases its demand. The line above, run with the same
              # switch on, is the machine pickup's regression.
              @{ Name = 'staging-pickup-no-station-timeout'; Runs = 1 }
              # control-server#713: the operator departs from the staging station -- with cargo, what was not loaded goes back
              # to the backlog and the vehicle leaves through the departure check; with nothing loaded, the journey closes in place.
              @{ Name = 'staging-depart-after-partial-load'; Runs = 1 }
              @{ Name = 'staging-depart-with-nothing-loaded'; Runs = 1 }
              # control-server#710: at the staging station, one side full and every waiting demand needing that side -- the vehicle
              # leaves at once; with nothing waiting it does not leave by itself. The second line is the other half: a demand that
              # still fits the other side is taken, and the vehicle does not leave for the drop-off.
              @{ Name = 'staging-side-full-departs'; Runs = 1 }
              @{ Name = 'staging-other-side-fits-holds'; Runs = 1 }
              # control-server#712: a vehicle that takes only STAGING_TO_WIRE, its journey ended at the staging station, stays
              # there instead of returning to a free waiting point, and takes the next staging demand where it stands.
              @{ Name = 'staging-only-vehicle-stays-at-staging-origin'; Runs = 1 }
              # control-server#752: a vehicle that takes only STAGING_TO_WIRE, idle elsewhere, returns to the staging origin --
              # reserved as its fixed task station -- instead of a waiting point; the second such vehicle falls back to one.
              @{ Name = 'staging-only-vehicle-returns-to-staging-origin'; Runs = 1 }
              # program#184 (first-wave checklist item 1): at the staging station with nothing loaded and the battery below the
              # mandatory charge line, the journey closes in place and the vehicle -- one that takes only STAGING_TO_WIRE, held at
              # the staging origin by control-server#712 -- still joins the charging queue and is sent to the charger.
              @{ Name = 'staging-low-battery-nothing-loaded-charges'; Runs = 1 }
              # Batch 5 (control-server#83): the cancellation before a sublot entry, waiting for the ALL_EMPTY
              # result before ending the stop. Same reason as the line above; the batch-5 exit makes it three runs.
              @{ Name = 'load-cancelled-before-sublot'; Runs = 1; BatchId = 'batch-5' }
              # Batch 5 (control-server#82): the entry revalidated after the operator made it, refused with the
              # reason on the wire when it no longer holds. Same reason as the line above; the batch-5 exit
              # (control-server#90) makes it three runs.
              @{ Name = 'sublot-rejected-after-entry'; Runs = 1; BatchId = 'batch-5' }
              # Batch 5 (control-server#80): blocked journeys with their start time on the dashboard. In CI from its own
              # ticket for the same reason; the batch-5 exit (control-server#90) makes it three runs.
              @{ Name = 'blocked-journey-dashboard-projection'; Runs = 1; BatchId = 'batch-5' }
              # Batch 5 (control-server#81): the load stop past its deadline -- a determinate failure settled
              # defensively, and a door left open raising STATION_TIMEOUT_DOOR_NOT_CLOSED. Same reason; the
              # batch-5 exit (control-server#90) makes it three runs.
              @{ Name = 'load-determinate-failure-and-door-open-timeout'; Runs = 1; BatchId = 'batch-5' }
              # Batch 4 (control-server#68), specification 8.3 scenario 4: the five kinds of bad area
              # assignment table each rejected whole. Same reason as the line above -- batches 4 and 5 both
              # merge into fp/v2-impl, so the scenario earns its place in CI from its own ticket; the
              # batch-4 exit (control-server#76) made it three runs.
              @{ Name = 'area-assignment-import-rejects'; Runs = 3; BatchId = 'batch-4' }
              @{ Name = 'area-assignment-unmapped-silent'; Runs = 3; BatchId = 'batch-4' }
              # Batch 4 (control-server#73), specification 8.3 scenarios 1 and 2: target slots chosen inside the
              # demand's slot group, and a demand waiting while its group is full. In CI from their own ticket for
              # the same reason as the line above; the batch-4 exit (control-server#76) made them three runs.
              @{ Name = 'slot-group-selection';           Runs = 3; BatchId = 'batch-4' }
              @{ Name = 'slot-group-temporarily-full';    Runs = 3; BatchId = 'batch-4' }
              # Batch 4 (control-server#74), specification 8.3 scenario 3: an oversized demand raised at once as a
              # structural dispatch block, and disabled slots that stay ordinary backlog. In CI from their own ticket for
              # the same reason as the line above; the batch-4 exit (control-server#76) made them three runs.
              @{ Name = 'structural-block-oversized-demand'; Runs = 3; BatchId = 'batch-4' }
              @{ Name = 'slot-group-disabled-no-alert';      Runs = 3; BatchId = 'batch-4' }
              # Batch 4 (control-server#75), specification 8.3 scenarios 5 and 7: the assignment version frozen at
              # dispatch, and a mixed-side station served by two trips. The batch-4 exit (control-server#76) made them
              # three runs.
              @{ Name = 'area-assignment-version-freeze';    Runs = 3; BatchId = 'batch-4' }
              @{ Name = 'mixed-side-station-two-trips';      Runs = 3; BatchId = 'batch-4' }
              # Batch 6 (program#123). Each ticket adds its own scenario here from its own pull request, sorted by
              # name, so a batch-6 regression is caught before the next one merges; the batch-6 exit
              # (control-server#165) made every line three runs. The job timeout was left as it is: a pull
              # request still runs each of these once, and the exit's consecutive-all round of all 36
              # scenarios three times each is expected near 20 minutes on 4 lanes (batch 5's 28 took 859
              # seconds, run 35361077376), far inside the 180 a dispatched run gets.
              # control-server#160, specification 8.3 batch-6 mechanism criterion 3: REQ-0187's AREA/EQP uniqueness
              # across task types.
              @{ Name = 'area-eqp-unique-across-task-types'; Runs = 3; BatchId = 'batch-6' }
              # control-server#162, specification 8.3 batch-6 mechanism criterion 5: a dashboard hold on one Map +
              # TASK_TYPE does not cascade; a catalog change holds only the task type bound to the changed station.
              @{ Name = 'binding-hold-dashboard-not-cascading'; Runs = 3; BatchId = 'batch-6' }
              @{ Name = 'catalog-change-binding-hold'; Runs = 3; BatchId = 'batch-6' }
              # control-server#163, specification 8.3 batch-6 mechanism criterion 6: STAGING_TO_WIRE runs the
              # journey in the reverse direction, and loads into the group its destination AREA is assigned.
              @{ Name = 'staging-to-wire-reversed-journey'; Runs = 3; BatchId = 'batch-6' }
              @{ Name = 'staging-to-wire-slot-group'; Runs = 3; BatchId = 'batch-6' }
              # control-server#160, criterion 2: the end station taken from the binding, frozen at acceptance.
              @{ Name = 'task-type-binding-admits-bound-station'; Runs = 3; BatchId = 'batch-6' }
              # control-server#160, criterion 1: a missing binding fails closed for its own task type only.
              @{ Name = 'task-type-binding-missing-not-cascading'; Runs = 3; BatchId = 'batch-6' }
              # control-server#159, specification 8.3 batch-6 mechanism criterion 4: one station bound to two task
              # types refuses start.
              @{ Name = 'task-type-binding-station-reused-refuses-start'; Runs = 3; BatchId = 'batch-6' }
              # Batch 7 (program#127). Each ticket adds its own scenario here from its own pull request, sorted by
              # name, one run each; the batch-7 exit (control-server#220) made every line three runs.
              # control-server#212: the loading phase. Holding for appends only where the zone allows appending (the
              # disabled one runs both ways of forbidding it, limit 0 and unconfigured, on one server); each side full
              # in one of its two ways; the holding timeout at 40 seconds; candidates that do not fit for any reason
              # other than the vehicle's own cargo never make a side full; and a full vehicle still taking an
              # appended demand until it leaves its last pickup.
              # control-server#217: the dashboard reads the holding vehicle's deadline and time left from the database,
              # and shows the yield once another vehicle is committed to the station.
              @{ Name = 'cargo-holding-dashboard-projection'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'cargo-holding-disabled-when-append-forbidden'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'cargo-holding-side-full'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'cargo-holding-timeout'; Runs = 3; BatchId = 'batch-7' }
              # control-server#216: the five kinds of bad per-zone dispatch parameter table each rejected whole, and a
              # good one taking effect as one new version without restarting the server.
              @{ Name = 'dispatch-zone-parameters-import-rejects'; Runs = 3; BatchId = 'batch-7' }
              # control-server#211, specification 8.3 batch-7 FP-IS-08. Four scenarios, and the first two are a pair
              # that only says anything together: with the zone's per-zone limit configured a vehicle under way takes
              # an appended demand into a three-stop plan (REQ-0196, REQ-0205, ADR-cross-0053), and with no limit
              # configured it takes none at all -- which is today's behaviour, and the guarantee that this change
              # does nothing on a site whose parameters have not been approved yet (REQ-0198, REQ-0203).
              # The delay gate one configures a limit of one millimetre, so the refusal can only come from the gate
              # itself rather than from the zone being unconfigured -- two refusals, two reason codes, and telling
              # them apart is what the site sees. The last one puts an idle and an in-transit vehicle on the same
              # candidate table and watches both paths run in one round (REQ-0200, REQ-0205).
              #
              # One departure from the ticket, deliberate and written up in PR #257: the ticket listed a
              # multi-stop-zone-continuity scenario asserting that the resulting stop sequence keeps each zone in one
              # contiguous run. en-route-append-not-configured took its place. They are not the same claim -- what L1
              # covers (ZoneContiguityRulesOutTheCheapestPlacementAndTheNextOneIsTaken) is that contiguity rules out a
              # placement, not that the sequence a run produces is contiguous, and multi-stop-append-same-zone appends
              # within one zone, where the sequence is contiguous by construction. The trade was made because the route
              # graph engine ships disabled, so "with it off, appending does nothing at all" is the deployment premise
              # a silent failure would hide.
              @{ Name = 'en-route-append-delay-gate'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'en-route-append-not-configured'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'idle-and-inflight-vehicles-compete'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'multi-stop-append-same-zone'; Runs = 3; BatchId = 'batch-7' }
              # control-server#234: the onboard stops sending while leaving its socket open. The server closes the
              # connection on ADR-cross-0027's six-second window, the in-flight journey carries ONBOARD_SESSION_LOST
              # so the blocked-journey card shows it, and nothing else about the journey moves (REQ-0287).
              @{ Name = 'onboard-silent-liveness-loss'; Runs = 3; BatchId = 'batch-7' }
              # control-server#215: an operator cancels a STAGING_TO_WIRE demand before its sublot, and the unload stop only it
              # used leaves the plan the vehicle holds, with the plan revision moving on (REQ-0197, ADR-cross-0053). It does
              # not run the other demands to completion; that half is L1 (see the scenario's header and the pull request).
              @{ Name = 'plan-reorder-and-drop-cancelled'; Runs = 3; BatchId = 'batch-7' }
              # control-server#215: a vehicle that leaves the map loses its not-yet-picked demand -- the pickup order is
              # cancelled and reconciled, the demand goes back to the backlog with its age, and a second vehicle takes it
              # under a new generation and upperId, its dispatch plan actually sent (REQ-0328).
              @{ Name = 'reassign-when-vehicle-ineligible'; Runs = 3; BatchId = 'batch-7' }
              # control-server#316 (#299's T1, before the v2 vehicle trial): an in-flight order RIoT reports HANG is named
              # ORDER_HANG with no order command, emergency stop or fault, and a continue in RIoT resumes the journey.
              @{ Name = 'in-transit-order-hang-continue'; Runs = 1 }
              # control-server#318 (source one, before the v2 vehicle trial): an in-flight pickup order a person cancels in
              # RIoT is named ORDER_ENDED_WITHOUT_ARRIVAL, left alone through the delay (no release, no redispatch, no command),
              # then rebuilt for the same vehicle and demand to the same stop. Replaces #316's in-transit-order-cancelled-held.
              @{ Name = 'in-transit-order-cancelled-rebuilt'; Runs = 1 }
              # control-server#770: the same cancellation, but when the rebuild falls due the battery is below the mandatory
              # charge line with nothing on board -- no rebuild, the demand goes back to the backlog, the vehicle to the charger.
              @{ Name = 'own-order-cancelled-low-battery-charges'; Runs = 1 }
              # control-server#299 (#299's T2, before the v2 vehicle trial): a person clears the fault an in-flight FAILED order
              # raised. A latched vehicle is refused (clearing never releases a latch); after REQ-0356's release an incomplete
              # request is refused with every reason; a complete one clears the fault and, since control-server#318, keeps the
              # demand on the vehicle and rebuilds its order after the delay; the same request twice does nothing, and an
              # unsigned one is still refused.
              @{ Name = 'vehicle-fault-operator-clearance'; Runs = 1 }
              # control-server#539 review S-4: the door half of the clearance, beside the FAILED half above.
              @{ Name = 'vehicle-fault-operator-clearance-door'; Runs = 1 }
              # control-server#345 (before the v2 vehicle trial): an own order rebuilt after a cancellation is cancelled again
              # within REQ-0361's window and the rebuilding stops; an unconfirmed request through #299's entry point is refused,
              # a confirmed REBUILD_STOPPED_ORDER rebuilds it once for the same vehicle and demand, and the same request again
              # answers AlreadyDone.
              @{ Name = 'in-transit-rebuild-stopped-person-rebuilds'; Runs = 1 }
              # control-server#324 (program#86's B shape, before the v2 vehicle trial): a second pickup ended by its station
              # deadline while the vehicle carries the first one's cargo. The vehicle gets that stop's empty worklist, a late
              # entry and a late cancellation are both answered WORKLIST_REVISION_STALE, and the next stop's worklist starts
              # above the empty one, the session never dropping on a revision conflict.
              @{ Name = 'stop-ended-journey-continues'; Runs = 1 }
              # control-server#742 (CP-0015 plan A): a cancel before scan that leaves a machine pickup with nothing loaded
              # while the journey goes on sends the vehicle on before the station departure deadline, and the screen keeps
              # no countdown; the first pickup, where something was loaded, still waits its full deadline (#668).
              @{ Name = 'load-cancelled-journey-continues-departs-early'; Runs = 1 }
              # control-server#742 extension (CP-0015): at a machine pickup with one basket loaded and the other demand cancelled,
              # a departure carrying the cancellation worklist's revision, already replaced by a deadline-only refresh, is
              # accepted (no substantive change) and the vehicle leaves before the station departure deadline.
              @{ Name = 'machine-departure-stale-worklist-after-cancel'; Runs = 1 }
              # control-server#214: the task-side ranking. A new STAGING_TO_WIRE demand is taken before an older normal-band
              # one (REQ-0202); with no anti-starvation threshold configured nothing escalates, and once one is imported
              # the overdue normal-band demand is escalated exactly once and goes ahead of a STAGING_TO_WIRE that is not
              # overdue (REQ-0202, REQ-0203, REQ-0210).
              @{ Name = 'starvation-threshold-escalation'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'task-type-priority-band'; Runs = 3; BatchId = 'batch-7' }
              # control-server#210, specification 8.3 batch-7 criterion 7: a key suppressed by a local cancellation stays out
              # under a new DemandId, the unrelated demand behind it is still taken, and a demand gone from the catalog
              # before acceptance suppresses nothing.
              @{ Name = 'transport-demand-key-suppressed'; Runs = 3; BatchId = 'batch-7' }
              # control-server#827, REQ-0366 (CP-0020): with the shipped 30-minute catalog age window, a demand MesIngest first
              # read 40 minutes ago is not taken by an idle vehicle and stays on the backlog card with its reason; a fresh one
              # is taken and delivered, and the stale one is judged again afterwards and still not taken.
              @{ Name = 'catalog-age-window'; Runs = 3 }
              # control-server#212, the two vehicle-full ones of the five above.
              @{ Name = 'vehicle-full-ignores-oversized-and-gated'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'vehicle-full-still-appends-before-departure'; Runs = 3; BatchId = 'batch-7' }
              # control-server#213, specification 8.3 batch-7 criterion 3: a vehicle holding at a station yields the moment
              # another vehicle is committed to that station as its next stop, and the yield does not break an open door
              # or a load under way -- the departure still waits for both to settle and for the pre-departure check.
              @{ Name = 'waiting-station-yield'; Runs = 3; BatchId = 'batch-7' }
              @{ Name = 'waiting-station-yield-waits-for-door'; Runs = 3; BatchId = 'batch-7' }
              # control-server#273, after the batch-7 exit: a loaded vehicle standing at the gate waiting for a person
              # has its battery read from RIoT and logged past the (shortened) threshold -- an error under the rescue line
              # -- the dashboard card shows it, and not one order is created for it (REQ-0169).
              @{ Name = 'waiting-journey-battery-watch'; Runs = 3; BatchId = 'batch-8' }
              # control-server#186, after the batch-7 exit and before v2 goes on a real vehicle: RIoT renames the Map under
              # the same mapId and every task type bound on it is held (source CATALOG_CHANGE, MAP_RENAMED) until FieldOps
              # accepts the new name and releases the holds; a Map list that cannot be read is not a rename (REQ-0341).
              @{ Name = 'map-rename-holds-all-task-types'; Runs = 3; BatchId = 'batch-8' }
              # control-server#388, specification 5.4 and 8.3 batch-8: two vehicles and one registered waiting point, and the
              # server refuses to start before it listens, naming both counts; nothing is accepted and no order is created.
              @{ Name = 'waiting-points-fewer-than-vehicles-refuses-start'; Runs = 3; BatchId = 'batch-8' }
              # control-server#389, REQ-0291/0292: two idle vehicles and one usable waiting point; exactly one commits to an
              # idle return (purpose claim and reservation in one save), and a later transport goes to the other vehicle.
              @{ Name = 'idle-return-two-vehicles-contend-one-waiting-point'; Runs = 3; BatchId = 'batch-8' }
              # control-server#391, REQ-0204 revised: a public station is held by one vehicle at a time. A vehicle heading
              # for a held gate goes on and is given it once released; a second demand at the staging station is not taken
              # while another vehicle holds it, and is taken only after that vehicle leaves on departure evidence.
              @{ Name = 'fixed-station-single-occupancy'; Runs = 3; BatchId = 'batch-8' }
              # control-server#383, REQ-0359: an administrator declares the slot a vehicle waits on faulty. At the pickup the
              # vehicle refuses (the door shut as it was declared) and nothing changes; at the gate it applies, the unload goes
              # to RecoveryRequired and the journey blocks.
              @{ Name = 'slot-fault-declaration'; Runs = 3; BatchId = 'batch-8' }
              # control-server#390, REQ-0293/0295: the idle vehicle's commitment becomes a journey and a single move to the
              # waiting point; on arrival the reservation turns into an occupancy and the purpose is released; a transport's
              # order leaves the occupancy standing until RIoT reports the vehicle elsewhere; unloaded at the gate, the vehicle
              # returns idle again and the gate is released on departure evidence.
              @{ Name = 'waiting-point-exclusive-reserve-occupy-release'; Runs = 3; BatchId = 'batch-8' }
              # control-server#400, specification 8.6 and 8.3 batch-9: the approved charging policy covers only the second of
              # two vehicles; the demand goes to it, and the first, asked first, is refused with CHARGING_POLICY_NOT_APPROVED
              # and gets no order (REQ-0282, per vehicle, the server keeps running).
              @{ Name = 'charging-policy-missing-vehicle-not-commissioned'; Runs = 3; BatchId = 'batch-9' }
              # control-server#403, REQ-0290: a vehicle below the mandatory charge entry threshold, asked first, takes no
              # transport (the other vehicle does); it gets no order, purpose or station at all.
              @{ Name = 'mandatory-charge-vehicle-takes-no-transport'; Runs = 3; BatchId = 'batch-9' }
              # control-server#403, REQ-0281: a policy whose thresholds break the relation is refused whole at import through
              # FieldOps; the default policy stays active and the next demand is dispatched under it.
              @{ Name = 'charging-thresholds-relation-refused'; Runs = 3; BatchId = 'batch-9' }
              # control-server#404, REQ-0172/0173: one charger, three vehicles below their line at once. The lowest battery
              # gets the CHARGING purpose and the reservation; a queued vehicle whose battery then falls lower does not take it.
              @{ Name = 'charging-one-charger-three-vehicles-contend'; Runs = 3; BatchId = 'batch-9' }
              # control-server#404, REQ-0171: the roster is emptied while one vehicle is on its way to the charger (it goes on);
              # a vehicle that then needs charging is put on manual charging hold and warned about; the roster back, it is
              # allocated only after its onboard sends the return to service.
              @{ Name = 'charging-registry-emptied-degrades-and-resumes'; Runs = 3; BatchId = 'batch-9' }
              # control-server#405, REQ-0281/0173: one vehicle charges to COMPLETE (purpose released, charger still occupied),
              # is sent away by a demand, and the charger is released only after it has left -- not when the order is issued.
              @{ Name = 'charging-full-cycle'; Runs = 3; BatchId = 'batch-9' }
              # control-server#405, specification 8.3/8.5 "one charger, three vehicles, the full one yields": the full vehicle
              # takes a demand and leaves, and the charger goes to the lowest queued vehicle.
              @{ Name = 'charging-full-vehicle-yields-charger'; Runs = 3; BatchId = 'batch-9' }
              # control-server#406, REQ-0174/0284: 407802 + final HANG + no CHARGING pauses the charger and holds the
              # vehicle where it is; an R-11 manual clearance releases the charger only once the old order has ended.
              @{ Name = 'charging-unable-to-charge-pauses-charger'; Runs = 3; BatchId = 'batch-9' }
              # control-server#406, REQ-0175: a HANG with another code, or 407802 away from the charger, pauses nothing.
              @{ Name = 'charging-general-fault-does-not-pause'; Runs = 3; BatchId = 'batch-9' }
              # control-server#407, REQ-0285/0286: charging stops below the threshold -- the charger and the vehicle's
              # charging eligibility are both paused, the vehicle stays where it is, and nothing is sent afterwards.
              @{ Name = 'charging-interruption-isolates'; Runs = 3; BatchId = 'batch-9' }
              # control-server#407, REQ-0285/0282: CHARGING with no gain over the frozen (shortened) window -- both paused.
              @{ Name = 'charging-no-progress-isolates'; Runs = 3; BatchId = 'batch-9' }
              # control-server#409, REQ-0178/0179: the clearing vehicle queues when no waiting point is eligible, wins the
              # last one in the round it frees, drives there, and the charger is released only in the arrival's round.
              @{ Name = 'charging-clearance-to-waiting-point'; Runs = 3; BatchId = 'batch-9' }
              # Batch 10 (program#169), specification 8.3 batch 10: the four same-direction task types. control-server#546:
              # none of the four bound -- each refused with TASK_TYPE_BINDING_MISSING while WIRE_TO_GATE runs; each bound --
              # loads at the AREA machine into the group its AREA is assigned and unloads at its bound station; and one
              # vehicle taking WIRE_TO_GATE, WIRE_TO_OPTICAL and WIRE_TO_NITROGEN by appends while stopped, unloading at
              # three drop-offs in turn, with a smaller allowance then refusing the second order at the delay gate.
              @{ Name = 'same-direction-binding-missing-not-cascading'; Runs = 3; BatchId = 'batch-10' }
              @{ Name = 'same-direction-die-to-oven-journey'; Runs = 3; BatchId = 'batch-10' }
              @{ Name = 'same-direction-die-to-wire-staging-journey'; Runs = 3; BatchId = 'batch-10' }
              @{ Name = 'same-direction-mixed-load-multi-drop'; Runs = 3; BatchId = 'batch-10' }
              @{ Name = 'same-direction-wire-to-nitrogen-journey'; Runs = 3; BatchId = 'batch-10' }
              @{ Name = 'same-direction-wire-to-optical-journey'; Runs = 3; BatchId = 'batch-10' }
              # program#195, control-server#737: the seventh task type WIRE_TO_FULL_INSPECTION, on a simulated station (the
              # full-inspection station is not on Map 26 yet) -- bound, it loads at the AREA machine and unloads at its
              # station; and agv01's four types in one journey by appends while stopped, the seventh joining at the last
              # pickup station while the vehicle holds cargo there, unloading at four drop-offs in turn.
              @{ Name = 'same-direction-wire-to-full-inspection-journey'; Runs = 3; BatchId = 'wire-to-full-inspection' }
              @{ Name = 'same-direction-four-type-mixed-load-multi-drop'; Runs = 3; BatchId = 'wire-to-full-inspection' }
              # control-server#749 (REQ-0196 as revised by CP-0015): after the vehicle leaves its first stop, the plan the
              # onboard acknowledges carries only the stops ahead, and an append after that is still placed.
              @{ Name = 'remaining-plan-after-passed-stop'; Runs = 3; BatchId = 'wire-to-full-inspection' }
              # control-server#754 (REQ-0352 as revised by CP-0015): the slots are assigned after the sublot entry, at the
              # lowest free slots of the side at that moment -- a demand appended behind one that the station deadline then
              # ended gets the slots that one left free, not the ones that were next at its acceptance.
              @{ Name = 'slot-assignment-after-scan'; Runs = 3; BatchId = 'wire-to-full-inspection' }
              # control-server#783: the stop waits for a sublot, someone drives the vehicle off and it comes to rest at another
              # station, the operator scans -- the entry is refused as STATION_MISMATCH and no slot command reaches the vehicle.
              @{ Name = 'scan-while-vehicle-away-from-stop'; Runs = 1 }
          )
          # One run's usual length in seconds, for dealing scenarios out to lanes longest first. Measured, not
          # remembered: scripts/l2/Get-L2LaneEstimates.ps1 reads them out of past rounds' logs, and its -AsJson
          # output is this file (where they came from is in its "source"). A scenario not listed counts 30.
          # Only the balance of the lanes depends on these, never what runs (control-server#554).
          $estimates = (Get-Content -Raw -LiteralPath ./scripts/l2/l2-lane-estimates.json | ConvertFrom-Json -AsHashtable).estimates

          # Registered before anything can fail, so the upload step below always has a path: without it
          # a setup error also shows "Input required and not supplied: path" beside the real reason.
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "l2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "L2_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # A setup error fails the round before any scenario runs; the annotation puts the reason on the
          # pull request's checks page instead of only in the log.
          function Stop-L2Setup([string]$Message) {
              Write-Host "::error title=L2 setup::$Message"
              throw $Message
          }

          $only = @($env:L2_ONLY -split ',' | ForEach-Object Trim | Where-Object { $_ })
          $unknown = @($only | Where-Object { $_ -notin $scenarios.Name })
          if ($unknown.Count -gt 0) {
              Stop-L2Setup "Not in this workflow's scenario list: $($unknown -join ', ')"
          }
          Write-Host "L2 mode: $env:L2_MODE$(if ($only.Count -gt 0) { "; only $($only -join ', ')" }); $env:L2_LANES lanes"

          # A pull request body line `L2-Consecutive: a, b` (any case, any spacing, commas or spaces,
          # backticks allowed) runs those scenarios three times each in this round.
          $bodyConsecutive = @()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
              $lines = [regex]::Matches($env:L2_PR_BODY ?? '', '(?im)^[ \t>*-]*L2-Consecutive[ \t]*:(.*)$')
              foreach ($line in $lines) {
                  $names = @($line.Groups[1].Value -replace '`', '' -split '[,\s]+' | Where-Object { $_ })
                  if ($names.Count -eq 0) {
                      Stop-L2Setup "The pull request body has an L2-Consecutive line that names no scenario."
                  }
                  $bodyConsecutive += $names
              }
              $bodyConsecutive = @($bodyConsecutive | Select-Object -Unique)
              $unknown = @($bodyConsecutive | Where-Object { $_ -notin $scenarios.Name })
              if ($unknown.Count -gt 0) {
                  Stop-L2Setup "L2-Consecutive in the pull request body names scenarios not in this workflow's list: $($unknown -join ', ')"
              }
              if ($bodyConsecutive.Count -gt 0) {
                  Write-Host "L2-Consecutive from the pull request body, three runs each: $($bodyConsecutive -join ', ')"
              }
          }

          # What runs and how often: the same rules as before the lanes, one entry per scenario.
          $items = @(foreach ($scenario in $scenarios) {
              if ($only.Count -gt 0 -and $scenario.Name -notin $only) { continue }
              $runs = switch ($env:L2_MODE) {
                  'consecutive'     { $scenario.Runs }
                  'consecutive-all' { [Math]::Max(3, $scenario.Runs) }
                  default           { $scenario.DefaultRuns ?? 1 }
              }
              if ($scenario.Name -in $bodyConsecutive) { $runs = [Math]::Max(3, $runs) }
              [pscustomobject]@{
                  Name = $scenario.Name; Runs = $runs; BatchId = $scenario.BatchId ?? 'batch-2'
                  EstimateSeconds = $estimates[$scenario.Name]
              }
          })

          Import-Module ./scripts/l2/L2Lanes.psm1 -Force
          $plan = @(Get-L2LanePlan -Items $items -LaneCount ([int]$env:L2_LANES))
          foreach ($lane in $plan) {
              Write-Host ("L2 lane $($lane.Lane) (slot $($lane.Slot), about $($lane.EstimateSeconds)s): " +
                  (($lane.Items | ForEach-Object { if ($_.Runs -eq 1) { $_.Name } else { "$($_.Name) x$($_.Runs)" } }) -join ', '))
          }

          # Build once, here, for every lane: a build under a running lane would overwrite the executables
          # it is running, so each scenario gets -SkipBuild. From the repository root so global.json picks
          # the SDK. Every project in the solution but tests/ (control-server#804): no L2 process loads the test
          # project, and compiling it was about 25 of the build's 57 seconds. The list is read out of the solution
          # each time, so a project added to it is built here without anyone remembering to.
          $l2Projects = @([regex]::Matches((Get-Content -Raw -LiteralPath ./ControlServer.sln), '"([^"]+\.csproj)"') |
              ForEach-Object { $_.Groups[1].Value } | Where-Object { -not $_.StartsWith('tests\') })
          if (@($l2Projects | Where-Object { $_ -ceq 'src\ControlServer.Host\ControlServer.Host.csproj' }).Count -ne 1) {
              Stop-L2Setup "Could not read the projects out of ControlServer.sln: $($l2Projects -join ', ')"
          }
          $l2Filter = Join-Path $env:RUNNER_TEMP "l2-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.slnf"
          @{ solution = @{ path = (Resolve-Path ./ControlServer.sln).Path; projects = $l2Projects } } |
              ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $l2Filter -Encoding utf8NoBOM
          Write-Host '::group::Build'
          Write-Host "Building $($l2Projects.Count) projects (ControlServer.sln without tests/): $($l2Projects -join ', ')"
          & dotnet build $l2Filter -c Release --nologo
          $buildCode = $LASTEXITCODE
          Write-Host '::endgroup::'
          if ($buildCode -ne 0) { Stop-L2Setup "dotnet build ControlServer.sln (without tests/) -c Release exited with $buildCode" }

          # A few seconds, here and not in test.yml because it needs this build's Microsoft.Data.Sqlite: the read snapshot
          # the multi-read charging probes go through (control-server#510), against real SQLite in WAL mode. A transaction
          # it left open would have every later probe read one old state until its wait timed out.
          & pwsh -NoProfile -File ./scripts/l2/Test-L2ReadSnapshot.ps1
          if ($LASTEXITCODE -ne 0) { Stop-L2Setup "Test-L2ReadSnapshot.ps1 exited with $LASTEXITCODE" }

          # Each run's stage root (its SQLite database and friends, under %TEMP%) goes inside the evidence
          # root: a passing run deletes its own, and a failing run's -- often the only place the cause is
          # written down -- is uploaded with the evidence and cleared with the runner's temp directory,
          # instead of piling up in NetworkService's profile (3607 of them by 2026-09-18).
          $stageTemp = Join-Path $evidenceRoot '_stage'
          $null = New-Item -ItemType Directory -Path $stageTemp -Force
          $env:TEMP = $stageTemp
          $env:TMP = $stageTemp

          $state = [hashtable]::Synchronized(@{ CheckEnabled = $true; Superseded = $false })
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $records = @(Invoke-L2LanePlan -Plan $plan -EvidenceRoot $evidenceRoot `
              -Orchestrator (Resolve-Path ./scripts/l2/Invoke-L2Scenario.ps1).Path -State $state)
          $wall = [Math]::Round($clock.Elapsed.TotalSeconds)

          # Every run's own console output, lane by lane; while the lanes ran only their start and end lines
          # were printed, because eight interleaved logs read as one garbled one.
          foreach ($record in $records) {
              Write-Host "::group::$($record.Label) -- lane $($record.Lane), slot $($record.Slot), $(if ($record.ExitCode -eq 0) { 'PASS' } else { "FAIL ($($record.ExitCode))" }), $($record.Seconds)s"
              if (Test-Path -LiteralPath $record.Log) { Get-Content -LiteralPath $record.Log | ForEach-Object { Write-Host $_ } }
              Write-Host '::endgroup::'
          }
          $failed = @($records | Where-Object ExitCode -ne 0)
          foreach ($record in $failed) {
              Write-Host "::error title=L2 scenario failed::$($record.Label) exited with $($record.ExitCode) (lane $($record.Lane), slot $($record.Slot))"
          }

          # What actually ran, per scenario -- the record a consecutive run is cited by. Lane and slot say
          # which scenarios ran beside which, which is the first thing to know about a red one.
          $summary = @("### L2 ($env:L2_MODE, $($plan.Count) lanes, ${wall}s)$(if ($state.Superseded) { ' -- superseded, remaining scenarios skipped' })", '',
                       '| Scenario | Lane | Slot | Consecutive | Last run | Result |', '| --- | --- | --- | --- | --- | --- |')
          foreach ($item in $items) {
              $last = @($records | Where-Object Scenario -eq $item.Name) | Select-Object -Last 1
              if (-not $last) { continue }
              $consecutive = if ($last.Scenario -in $bodyConsecutive) { 'L2-Consecutive' } elseif ($last.Runs -ge 3) { 'yes' } else { '' }
              $result = if ($last.ExitCode -eq 0) { 'PASS' } else { "FAIL ($($last.ExitCode))" }
              $summary += "| $($last.Scenario) | $($last.Lane) | $($last.Slot) | $consecutive | $($last.Run)/$($last.Runs) | $result |"
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary | ForEach-Object { Write-Host $_ }

          if ($failed.Count -gt 0) {
              throw "L2 scenarios failed: $(($failed | ForEach-Object Label) -join ', ')"
          }

      # Always: a failed run's evidence is the only account of why, and the runner's temp directory
      # is cleared before the next job.
      #
      # continue-on-error, because this uploads diagnostics, not a deliverable. The verdict is the
      # step above -- Invoke-L2Scenario.ps1's exit code -- and it has already been reached by the
      # time this runs. Without this, a transient ECONNRESET from the artifact service turns a run
      # whose scenarios all passed into a red one: measured 2026-09-16 on run 35046150056 (PR #97),
      # where all 15 synthetic scenarios passed and only the upload failed, and a manual job re-run
      # of the identical commit went green. That is noise standing in for a verdict, in both
      # directions -- it can invent a red, and it trains us to re-run reds without reading them.
      # release.yml is deliberately NOT like this: that one uploads the release package itself, so
      # a failed upload there IS a failed run.
      - name: Upload L2 evidence
        if: always() && steps.l2-scope.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: l2-evidence
          path: ${{ env.L2_EVIDENCE_ROOT }}
          if-no-files-found: warn

      # After the upload, not before: a failed run's stage root is part of what was uploaded. The runner
      # clears its temp directory before the next job anyway; this makes it not depend on that.
      - name: Remove L2 evidence and stage roots
        if: always() && env.L2_EVIDENCE_ROOT != ''
        continue-on-error: true
        shell: pwsh
        run: Remove-Item -LiteralPath $env:L2_EVIDENCE_ROOT -Recurse -Force -ErrorAction SilentlyContinue

  # The real-onboard rig, since 2026-09-19. A job of this workflow rather than a workflow of its own
  # because workflow_dispatch only reaches workflows that exist on the default branch (main), which
  # this line does not merge into.
  # Everything specific to it is in the comment at the top of this file.
  real-rig:
    if: github.event_name == 'workflow_dispatch' && inputs.rig == 'real'
    runs-on: [self-hosted, cs-desktop]
    # A timeout ends the job by cancelling it, which may take the path that wedges a runner, so it
    # must never be what ends a round. consecutive-all over the whole list is 30 runs of 40 to 120
    # seconds on vm01, a batch exit perhaps 45; each run may also wait up to 30 minutes for memory and
    # 30 for the desktop lock. The run step stops starting runs after RIG_START_DEADLINE_MINUTES and
    # fails on its own, which leaves one worst-case run (about 70 minutes) plus the upload inside this.
    timeout-minutes: 360
    env:
      # Same reason as the scenarios job: NuGet's audit fetch failing is a red run that says nothing about code.
      NuGetAudit: 'false'
      RIG_MODE: ${{ inputs.mode }}
      RIG_ONLY: ${{ inputs.scenarios }}
      RIG_BATCH_ID: ${{ inputs.batch_id }}
      # Whole-machine commit guard (see the run step). A scenario starts only while at most this much is committed, so
      # that its own increment fits under what the machine can back with a margin. 12 until control-server#820, set for
      # win11-01 (a 16 GiB commit limit). 20 for vm-win-01, an absolute number because its commit limit moves with dynamic
      # memory (20-33 GiB measured): a real-onboard scenario adds 3-5 GiB there (8.59 -> 13.33 and 8.48 -> 11.51 on
      # 2026-10-20), so 20 + 5 stays under the guest's 32 GB maximum and under the 28 GB or so the host was seen able to
      # give it (the v2 workspace's ci-research/migration-vm-win-01-build-log.md 2.7).
      RIG_COMMIT_START_CEILING_GIB: '20'
      RIG_COMMIT_WAIT_MINUTES: '30'
      RIG_START_DEADLINE_MINUTES: '270'
      # No build servers. They outlive the build by minutes, and on the first CI round (run
      # 35449244079) the job's own server build and peer publishes left about 3 GiB committed through
      # both scenarios: 8.08 GiB peak against 3.45 idle, of which the scenarios themselves were about
      # 1.7. This job builds once and then runs for up to hours, so a warm compiler buys nothing.
      # MSBuild reads UseSharedCompilation from the environment like any property, so it reaches the
      # peer publishes inside Invoke-L2Scenario.ps1 too.
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      UseSharedCompilation: 'false'

    steps:
      # Each repository in its own subdirectory. A peer checked out into the server's work tree would
      # sit inside it, and a peer's clean-tree check is what Get-L2PeerPublish relies on.
      # The pair around every checkout of this repository on a self-hosted runner: scripts/Test-CheckoutSparseState.ps1.
      - name: Clear sparse-checkout state an earlier job left behind
        shell: pwsh
        env:
          CHECKOUT_PATH: control-server
        run: |
          $config = Join-Path $env:GITHUB_WORKSPACE ($env:CHECKOUT_PATH ?? '.') '.git/config'
          $stale = if (Test-Path -LiteralPath $config) { git config --file $config --get core.sparseCheckout }
          if ($stale) {
              Write-Host "::notice title=Sparse-checkout state cleared::core.sparseCheckout=$stale in $config, left by an earlier job"
              git config --file $config --unset-all core.sparseCheckout
              git config --file $config --unset-all core.sparseCheckoutCone
              if (git config --file $config --get core.sparseCheckout) { Write-Host "::error::core.sparseCheckout is still set in $config"; exit 1 }
          }
          exit 0

      # Without evidence/, as in the scenarios job (control-server#804). The two peers below keep a full checkout:
      # Get-L2PeerPublish clones each one from its checkout, and a sparse checkout is a blob:none partial clone that
      # such a clone would have to fill from GitHub.
      # In cone mode, every top-level directory but evidence/ listed: non-cone mode writes the core.sparseCheckout in
      # .git/config that broke later jobs (see the step above). Test-CheckoutSparseState.ps1 holds the list to the repository.
      - uses: actions/checkout@v7
        with:
          path: control-server
          sparse-checkout: |
            .config
            .github
            docs
            scripts
            src
            tests
            tools
            vendor

      - name: Check the checkout is the tree it asked for
        shell: pwsh
        working-directory: control-server
        env:
          CHECKOUT_EXCLUDE: evidence
          CHECKOUT_SPARSE: |
            .config
            .github
            docs
            scripts
            src
            tests
            tools
            vendor
        run: |
          if (Test-Path -LiteralPath scripts/Assert-CheckoutTree.ps1) { pwsh -NoProfile -File scripts/Assert-CheckoutTree.ps1; exit $LASTEXITCODE }
          if (git ls-tree --name-only HEAD scripts/Assert-CheckoutTree.ps1) {
              Write-Host '::error title=Checkout incomplete::scripts/Assert-CheckoutTree.ps1 is in HEAD but not in the worktree'
              exit 1
          }
          Write-Host "::warning title=Checkout not checked::$(git rev-parse HEAD) predates scripts/Assert-CheckoutTree.ps1"
          exit 0

      - uses: actions/checkout@v7
        with:
          repository: trytoreachpeak0/8005-agv-onboard-hmi
          ref: ${{ inputs.onboard_ref }}
          path: peers/8005-agv-onboard-hmi

      - uses: actions/checkout@v7
        with:
          repository: trytoreachpeak0/slots-simulator
          ref: ${{ inputs.simulator_ref }}
          path: peers/slots-simulator

      # Exit code is the contract, as in the scenarios job: the guest is zh-CN, so nothing here matches on
      # English console text. Invoke-L2Scenario.ps1 exits non-zero on FAIL.
      - name: Run real-onboard L2 scenarios
        shell: pwsh
        working-directory: control-server
        run: |
          # Runs is each scenario's consecutive count, as in the scenarios job. Batch 6's exit (control-server#165)
          # ran real-onboard-expected-action-overdue and real-onboard-durable-ack-lost three times and the
          # rest once; that is what `consecutive` reproduces. Adding a real-onboard scenario: one line.
          #
          # real-onboard-recovery-entry-missing was retired by control-server#622 (2026-10-13). Its fault injection -- close a
          # slot empty and wait out the onboard's operator timeout -- stopped producing a result once onboard-hmi#72
          # (b85b97a) and onboard-hmi#78 (96dffa0) made the onboard reopen a door closed empty (CI run 38107859209,
          # control-server#250). Most of its criteria are covered by real-onboard-restart-with-open-recovery-session (an
          # UNKNOWN load made through Invoke-G3UnknownLoad), real-onboard-compensate-then-reconnect (the same
          # stop-close-restart injection written inline; it does not call Invoke-G3UnknownLoad) and
          # real-onboard-slot-fault-declaration (L2-RSFD-04 judges the block reason). Two gaps are left: exactly one result
          # for the attempt and none superseded; and the recovery entry offered after a live session, with no onboard
          # restart, turns RecoveryRequired mid-session -- the latter followed up in control-server#690. The coverage
          # table is in control-server#622.
          $scenarios = @(
              @{ Name = 'real-onboard-normal-load';                           Runs = 1 }
              @{ Name = 'real-onboard-clock-skew';                            Runs = 1 }
              @{ Name = 'real-onboard-load-door-closed-empty-reopens';        Runs = 1 }
              @{ Name = 'real-onboard-station-timeout-door-open';             Runs = 1 }
              @{ Name = 'real-onboard-unload-not-emptied';                    Runs = 1 }
              @{ Name = 'real-onboard-compensate-then-reconnect';             Runs = 1 }
              @{ Name = 'real-onboard-restart-while-waiting-operator';        Runs = 1 }
              @{ Name = 'real-onboard-cancellation-authorization-lost';       Runs = 1 }
              @{ Name = 'real-onboard-durable-ack-lost';                      Runs = 3 }
              @{ Name = 'real-onboard-expected-action-overdue';               Runs = 3 }
              # control-server#316: an in-flight order RIoT reports HANG is named ORDER_HANG while the real onboard's session is
              # not Ready on this server's own order, which is the normal state in transit and invisible to the synthetic peer.
              @{ Name = 'real-onboard-order-hang-continue';                   Runs = 1 }
              @{ Name = 'real-onboard-restart-with-open-recovery-session';    Runs = 1 }
              @{ Name = 'real-onboard-restart-after-recovery-session-opened'; Runs = 1 }
              # Batch 7 (control-server#218): the specification 8.3 batch-7 real-rig L2, a mixed-side station with a front
              # and a rear demand at one stop. Listed so the batch exit (control-server#220) can run it here.
              @{ Name = 'real-onboard-mixed-side-one-stop';                  Runs = 1 }
              # control-server#339: a link dropped while the journey waits for a sublot; the deadline the runtime refills
              # after the reconnect has to reach the real onboard, read back from its own journal.
              @{ Name = 'real-onboard-refilled-deadline-reaches-vehicle';     Runs = 1 }
              # control-server#345: a rebuild stopped on cargo not in its slots is handed by a person to the exception recovery
              # session; readiness turns RECOVERY_REQUIRED so the real onboard offers the fault cargo handoff.
              @{ Name = 'real-onboard-rebuild-stopped-cargo-handoff';        Runs = 1 }
              # control-server#366: an own order cancelled in RIoT with cargo on board is rebuilt only on a snapshot received
              # after it fell due and after the vehicle was last held; emptied under someone else's stop it stops, and the
              # exception session's handoff takes it to the end though there is no fault cargo binding.
              @{ Name = 'real-onboard-cancelled-rebuild-cargo-proof';        Runs = 1 }
              # control-server#325 (program#86 v2): once the station deadline ends a stop, the real onboard shows none of it,
              # and a late cancellation and a late scan made before the closing worklist arrives are both refused as STALE.
              @{ Name = 'real-onboard-stale-stop-after-station-timeout';     Runs = 1 }
              # control-server#751 (REQ-0365): at the default limit 0 the station deadline ends the demand; the real onboard stops
              # asking for it, it is not dispatched again, and nothing reconnects. The name is control-server#703 review M3's.
              @{ Name = 'real-onboard-station-timeout-redispatch';            Runs = 1 }
              # control-server#335 (REQ-0246): the real onboard, not Ready for the whole leg on this server's order, drives and
              # reconnects without a hold; a lock feedback forced to 0 holds this order and stops once; locked again, the
              # latch is released and the held order waits for a person.
              @{ Name = 'real-onboard-in-transit-door-facts';                Runs = 1 }
              # control-server#375: the read before the pickup leg's create, and later the gate leg's, answers nothing (the fake RIoT
              # fails that one read); each never-sent intent is created once RIoT answers it is absent, after the vehicle check reads
              # the real onboard -- on the gate leg with cargo on board.
              @{ Name = 'real-onboard-unread-pre-create-read';               Runs = 1 }
              # control-server#383, REQ-0359: the declaration reaches the real onboard, which stops the unlock wait, reports the
              # slot UNKNOWN under SLOT_FAULT_DECLARED and answers APPLIED; the journey blocks. Needs an onboard_ref that
              # contains onboard-hmi#215: an onboard without it does not know SlotFaultDeclarationCommand and drops its session.
              @{ Name = 'real-onboard-slot-fault-declaration';               Runs = 3 }
              # control-server#405 (onboard half onboard-hmi#220): a charging cycle on the real onboard -- CHARGING and COMPLETE
              # shown, no entry at the charger, entry at the pickup once the full vehicle is sent away, the charger released.
              @{ Name = 'real-onboard-charging-cycle';                       Runs = 3 }
              # control-server#405 (control-server#404 review S6): the server-held manual charging hold shown on the real onboard,
              # kept when the battery comes back, and lifted only by the administrator's 充电后返回服务.
              @{ Name = 'real-onboard-manual-charging-hold-return';          Runs = 1 }
              # control-server#573: the plant's non-final order listing churning while it is paged (the fake RIoT's listing
              # churn) must not make the real onboard flash not-ready and restart the station departure wait.
              @{ Name = 'real-onboard-departure-under-listing-churn';        Runs = 1 }
              # control-server#573: the same churn from arrival at the pickup on, so the load's WAITING_OPERATOR progress
              # still reaches the server (before the fix it was lost to a not-ready flash, run 38067577157).
              @{ Name = 'real-onboard-load-under-listing-churn';             Runs = 1 }
              # control-server#205 (control-server#189, onboard-hmi#127): a link dropped while a load waits for the operator; the
              # result of that attempt is accepted in the new generation and the session returns to Ready without a second drop.
              @{ Name = 'real-onboard-inflight-load-reconnect';              Runs = 1 }
              # program#184 (control-server#713, onboard-hmi#349): the staging departure round trip between the two real ends --
              # 出发 pressed on the shipped HMI after a partial load and with nothing loaded, and the automatic departure of a
              # loaded vehicle short of charge, which delivers first and is then sent to the charger. Needs an onboard_ref that
              # contains onboard-hmi#349 (protocol 4.0.0 candidate): an older onboard has no 出发 and cannot handshake v4.
              @{ Name = 'real-onboard-staging-depart-partial-load';           Runs = 1 }
              @{ Name = 'real-onboard-staging-depart-nothing-loaded';         Runs = 1 }
              @{ Name = 'real-onboard-staging-low-battery-departs-with-cargo'; Runs = 1 }
              # 出发 at a machine pickup once its loads are complete (control-server#725, CP-0014): needs an onboard_ref that
              # contains onboard-hmi#352, which offers the button there.
              @{ Name = 'real-onboard-machine-depart-cargo-holding';         Runs = 1 }
              # A worklist row's 取消 at the staging pickup stop (control-server#726, CP-0014 revision two): the demand ends and is
              # suppressed, the rest of the rows go on with a refreshed worklist and entry request, and cancelling the last row with
              # cargo on board ends the stop and leaves 出发. Needs an onboard_ref that contains onboard-hmi#353 (the row's 取消).
              @{ Name = 'real-onboard-staging-row-cancel';                   Runs = 1 }
          )

          # Registered before anything can fail, so the upload step always has a path.
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "real-rig-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $null = New-Item -ItemType Directory -Path $evidenceRoot -Force
          "RIG_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          function Stop-RigSetup([string]$Message) {
              Write-Host "::error title=Real-rig setup::$Message"
              throw $Message
          }

          $only = @($env:RIG_ONLY -split ',' | ForEach-Object Trim | Where-Object { $_ })
          $unknown = @($only | Where-Object { $_ -notin $scenarios.Name })
          if ($unknown.Count -gt 0) { Stop-RigSetup "Not in this workflow's scenario list: $($unknown -join ', ')" }

          $runList = @(foreach ($scenario in $scenarios) {
              if ($only.Count -gt 0 -and $scenario.Name -notin $only) { continue }
              $runs = switch ($env:RIG_MODE) {
                  'consecutive'     { $scenario.Runs }
                  'consecutive-all' { [Math]::Max(3, $scenario.Runs) }
                  default           { 1 }
              }
              [pscustomobject]@{ Name = $scenario.Name; Runs = $runs }
          })

          $onboardRepository = (Resolve-Path ../peers/8005-agv-onboard-hmi).Path
          $simulatorRepository = (Resolve-Path ../peers/slots-simulator).Path
          $commits = [ordered]@{
              'control-server'       = (git rev-parse HEAD).Trim()
              '8005-agv-onboard-hmi' = (git -C $onboardRepository rev-parse HEAD).Trim()
              'slots-simulator'      = (git -C $simulatorRepository rev-parse HEAD).Trim()
          }
          $commits | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidenceRoot 'commits.json') -Encoding utf8NoBOM
          Write-Host "Mode $env:RIG_MODE; $(($runList | ForEach-Object { if ($_.Runs -eq 1) { $_.Name } else { "$($_.Name) x$($_.Runs)" } }) -join ', ')"
          $commits.GetEnumerator() | ForEach-Object { Write-Host "  $($_.Key) @ $($_.Value)" }

          # Whole-machine committed memory, sampled every 2 seconds for the whole step into
          # commit-samples.csv. Committed bytes, not the process tree: what fails an allocation on this
          # guest is the machine reaching its commit limit, whoever holds the rest.
          function Get-CommitGiB {
              $m = Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory
              [pscustomobject]@{ Committed = [Math]::Round($m.CommittedBytes / 1GB, 2); Limit = [Math]::Round($m.CommitLimit / 1GB, 2) }
          }
          $samplesPath = Join-Path $evidenceRoot 'commit-samples.csv'
          $sampler = Start-ThreadJob -ArgumentList $samplesPath -ScriptBlock {
              param($path)
              'utc,committedGiB,limitGiB' | Set-Content -LiteralPath $path -Encoding utf8NoBOM
              while ($true) {
                  $m = Get-CimInstance Win32_PerfFormattedData_PerfOS_Memory
                  [string]::Format([Globalization.CultureInfo]::InvariantCulture, '{0:o},{1:F2},{2:F2}', [DateTime]::UtcNow, ($m.CommittedBytes / 1GB), ($m.CommitLimit / 1GB)) |
                      Add-Content -LiteralPath $path -Encoding utf8NoBOM
                  Start-Sleep -Seconds 2
              }
          }

          # Crash dialogs present before the round, so the check at the end only blames this one.
          $werBefore = @(Get-Process WerFault -ErrorAction SilentlyContinue | ForEach-Object Id)

          # Build once for every run: -SkipBuild then, as in the scenarios job. From the repository root so
          # global.json picks the SDK. Without tests/, read out of the solution as in the scenarios job (control-server#804).
          $l2Projects = @([regex]::Matches((Get-Content -Raw -LiteralPath ./ControlServer.sln), '"([^"]+\.csproj)"') |
              ForEach-Object { $_.Groups[1].Value } | Where-Object { -not $_.StartsWith('tests\') })
          if (@($l2Projects | Where-Object { $_ -ceq 'src\ControlServer.Host\ControlServer.Host.csproj' }).Count -ne 1) {
              Stop-RigSetup "Could not read the projects out of ControlServer.sln: $($l2Projects -join ', ')"
          }
          $l2Filter = Join-Path $env:RUNNER_TEMP "real-rig-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.slnf"
          @{ solution = @{ path = (Resolve-Path ./ControlServer.sln).Path; projects = $l2Projects } } |
              ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $l2Filter -Encoding utf8NoBOM
          Write-Host '::group::Build'
          Write-Host "Building $($l2Projects.Count) projects (ControlServer.sln without tests/): $($l2Projects -join ', ')"
          & dotnet build $l2Filter -c Release --nologo
          $buildCode = $LASTEXITCODE
          Write-Host '::endgroup::'
          if ($buildCode -ne 0) { Stop-RigSetup "dotnet build ControlServer.sln (without tests/) -c Release exited with $buildCode" }
          # Belt and braces for the environment above: anything a build still left running goes now.
          & dotnet build-server shutdown *> $null

          # The read snapshot the G3 charging scenarios read through (control-server#510), checked against this build's SQLite
          # as in the scenarios job.
          & pwsh -NoProfile -File ./scripts/l2/Test-L2ReadSnapshot.ps1
          if ($LASTEXITCODE -ne 0) { Stop-RigSetup "Test-L2ReadSnapshot.ps1 exited with $LASTEXITCODE" }

          # Each run's stage root goes inside the evidence root, as in the scenarios job.
          $stageTemp = Join-Path $evidenceRoot '_stage'
          $null = New-Item -ItemType Directory -Path $stageTemp -Force
          $env:TEMP = $stageTemp
          $env:TMP = $stageTemp

          $ceiling = [double]$env:RIG_COMMIT_START_CEILING_GIB
          $deadlineMinutes = [double]$env:RIG_START_DEADLINE_MINUTES
          $records = [Collections.Generic.List[object]]::new()
          # Why the round stopped early, if it did: NOT_STARTED_COMMIT_GUARD or NOT_STARTED_DEADLINE.
          $stoppedBy = $null
          $leftovers = @()
          $jobClock = [Diagnostics.Stopwatch]::StartNew()

          # Everything after this runs under try/finally, so the leftover check, the summary and the
          # verdict happen even when something throws mid-round (a CIM query, a child that cannot start).
          try {
              foreach ($item in $runList) {
                  if ($stoppedBy) { break }
                  for ($run = 1; $run -le $item.Runs; $run++) {
                      $label = '{0}-{1:D2}' -f $item.Name, $run

                      # The round's own deadline. Each run can wait up to 30 minutes for memory and 30 for
                      # the desktop lock, with no bound on the sum; a batch exit is some 45 runs. So no new
                      # run starts after RIG_START_DEADLINE_MINUTES, which leaves one worst-case run (both
                      # waits plus a slow scenario, about 70 minutes) inside timeout-minutes. The job then
                      # fails with its own verdict instead of being cancelled by the timeout.
                      if ($jobClock.Elapsed.TotalMinutes -gt $deadlineMinutes) {
                          Write-Host "::error title=Round deadline::$label not started: $([Math]::Round($jobClock.Elapsed.TotalMinutes)) minutes into the job, past the $deadlineMinutes-minute start deadline"
                          $records.Add([pscustomobject]@{
                              Label = $label; Scenario = $item.Name; Run = $run; Runs = $item.Runs
                              ExitCode = 'NOT_STARTED_DEADLINE'; Result = 'NOT_STARTED_DEADLINE'; Seconds = 0; CommittedAtStartGiB = $null
                          })
                          $stoppedBy = 'NOT_STARTED_DEADLINE'
                          break
                      }

                      # The commit guard. Waits first: whatever holds the memory (the synthetic job's
                      # eight lanes, the two test.yml runners, the onboard HMI's CI) finishes in minutes.
                      $waitClock = [Diagnostics.Stopwatch]::StartNew()
                      $commit = Get-CommitGiB
                      while ($commit.Committed -gt $ceiling -and $waitClock.Elapsed.TotalMinutes -lt [double]$env:RIG_COMMIT_WAIT_MINUTES) {
                          Write-Host "RIG_COMMIT_WAITING: $($commit.Committed)/$($commit.Limit) GiB committed, starting at or below $ceiling"
                          Start-Sleep -Seconds 30
                          $commit = Get-CommitGiB
                      }
                      # Still above after the whole wait: stop the round with a verdict of its own. Starting
                      # anyway risks an allocation failure that reads as a product defect, and letting the
                      # job timeout end it would cancel the job, which can wedge the runner.
                      if ($commit.Committed -gt $ceiling) {
                          Write-Host "::error title=Commit guard::$label not started: $($commit.Committed)/$($commit.Limit) GiB committed after waiting $env:RIG_COMMIT_WAIT_MINUTES minutes (ceiling $ceiling)"
                          $records.Add([pscustomobject]@{
                              Label = $label; Scenario = $item.Name; Run = $run; Runs = $item.Runs
                              ExitCode = 'NOT_STARTED_COMMIT_GUARD'; Result = 'NOT_STARTED_COMMIT_GUARD'; Seconds = 0; CommittedAtStartGiB = $commit.Committed
                          })
                          $stoppedBy = 'NOT_STARTED_COMMIT_GUARD'
                          break
                      }

                      $runRoot = Join-Path $evidenceRoot $label
                      $log = "$runRoot.log"
                      $arguments = @('-Scenario', $item.Name, '-EvidenceRoot', $runRoot,
                          '-OnboardRepository', $onboardRepository, '-SimulatorRepository', $simulatorRepository, '-SkipBuild')
                      if ($env:RIG_BATCH_ID) { $arguments += '-BatchId', $env:RIG_BATCH_ID }

                      Write-Host "$label starting at $($commit.Committed) GiB committed"
                      $clock = [Diagnostics.Stopwatch]::StartNew()
                      # A child pwsh per run, so one scenario's modules and state never leak into the next.
                      & pwsh -NoProfile -File ./scripts/l2/Invoke-L2Scenario.ps1 @arguments *>&1 |
                          Tee-Object -FilePath $log | Out-Null
                      $exitCode = $LASTEXITCODE
                      $seconds = [Math]::Round($clock.Elapsed.TotalSeconds)
                      # A run that waited out the desktop lock never started its scenario: that is the
                      # schedule colliding with 8005-mes-ingest's desktop jobs, not a product red, and the
                      # summary says so.
                      $result = if ($exitCode -eq 0) { 'PASS' }
                          elseif (Select-String -LiteralPath $log -SimpleMatch 'DESKTOP_LOCK_BUSY' -Quiet) { 'NOT_STARTED_DESKTOP_LOCK' }
                          else { "FAIL ($exitCode)" }
                      $records.Add([pscustomobject]@{
                          Label = $label; Scenario = $item.Name; Run = $run; Runs = $item.Runs
                          ExitCode = $exitCode; Result = $result; Seconds = $seconds; CommittedAtStartGiB = $commit.Committed
                      })
                      # This run's own log now, not only at the end: a long round is readable while it runs.
                      Write-Host "::group::$label -- $result, ${seconds}s"
                      if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log | ForEach-Object { Write-Host $_ } }
                      Write-Host '::endgroup::'
                  }
              }
          } finally {
              Stop-Job $sampler -ErrorAction SilentlyContinue; Remove-Job $sampler -Force -ErrorAction SilentlyContinue

              # What the round left behind. This desktop renders golden baselines, so a leftover onboard or
              # simulator window, an orphaned server or double, or a crash dialog of ours is a defect here:
              # listed, closed, and the round fails. Only processes started from this round's own
              # directories (the checkouts, the evidence and stage roots, the peer publish cache), and crash
              # dialogs raised for such a process -- 8005-mes-ingest's desktop jobs may be running windows,
              # and crashing, between our scenarios, and those are not ours to close.
              $ownRoots = @(@((Resolve-Path ..).Path, $evidenceRoot, (Join-Path $env:LOCALAPPDATA '8005-l2-peers')) |
                  ForEach-Object { $_.TrimEnd([char]'\') + [char]'\' })
              $isOurs = { param($path) $path -and @($ownRoots | Where-Object { $path.StartsWith($_, [StringComparison]::OrdinalIgnoreCase) }).Count -gt 0 }
              $leftovers = @(Get-Process | Where-Object { & $isOurs $_.Path })
              # WerFault is started as `WerFault.exe -u -p <pid> ...`; the crashed process stays alive while
              # its dialog is up, so its path tells whose crash it is.
              foreach ($wer in @(Get-CimInstance Win32_Process -Filter "Name = 'WerFault.exe'" -ErrorAction SilentlyContinue)) {
                  if ($wer.ProcessId -in $werBefore) { continue }
                  $crashedPid = if ($wer.CommandLine -match '-p\s+(\d+)') { [int]$Matches[1] } else { $null }
                  $crashed = if ($crashedPid) { Get-Process -Id $crashedPid -ErrorAction SilentlyContinue } else { $null }
                  if ($crashed -and (& $isOurs $crashed.Path)) {
                      $leftovers += @(Get-Process -Id $wer.ProcessId -ErrorAction SilentlyContinue)
                  } else {
                      Write-Host "::warning title=Crash dialog not ours::WerFault pid $($wer.ProcessId) for pid $crashedPid; left alone"
                  }
              }
              foreach ($process in $leftovers) {
                  Write-Host "::error title=Leftover process::$($process.ProcessName) (pid $($process.Id)) $($process.Path) window '$($process.MainWindowTitle)'"
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }

              $values = @(Import-Csv -LiteralPath $samplesPath -ErrorAction SilentlyContinue |
                  ForEach-Object { [double]::Parse($_.committedGiB, [Globalization.CultureInfo]::InvariantCulture) })
              $peak = ($values | Measure-Object -Maximum).Maximum
              $floor = ($values | Measure-Object -Minimum).Minimum

              $summary = @(
                  "### Real-onboard L2 ($env:RIG_MODE, $($records.Count) runs$(if ($stoppedBy) { ", stopped: $stoppedBy" }))", '',
                  "control-server $($commits['control-server']), onboard $($commits['8005-agv-onboard-hmi']), simulator $($commits['slots-simulator'])", '',
                  "Whole-machine committed memory during the step: min $floor GiB, peak $peak GiB ($($values.Count) samples, commit-samples.csv in the evidence).", '',
                  '| Run | Result | Seconds | Committed at start (GiB) |', '| --- | --- | --- | --- |'
              )
              foreach ($record in $records) {
                  $summary += "| $($record.Label) | $($record.Result) | $($record.Seconds) | $($record.CommittedAtStartGiB) |"
              }
              if ($leftovers.Count -gt 0) { $summary += '', "Leftover processes closed: $(($leftovers | ForEach-Object ProcessName) -join ', ')" }
              $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              $summary | Set-Content -LiteralPath (Join-Path $evidenceRoot 'SUMMARY.md') -Encoding utf8NoBOM
              $summary | ForEach-Object { Write-Host $_ }
          }

          if ($stoppedBy) { throw "RIG_$($stoppedBy -replace '^NOT_STARTED_', ''): the round stopped before $(($records | Select-Object -Last 1).Label)." }
          $lockTimeouts = @($records | Where-Object Result -eq 'NOT_STARTED_DESKTOP_LOCK')
          $failed = @($records | Where-Object { $_.Result -like 'FAIL*' })
          if ($failed.Count -gt 0) { throw "Real-onboard scenarios failed: $(($failed | ForEach-Object Label) -join ', ')" }
          if ($lockTimeouts.Count -gt 0) { throw "RIG_DESKTOP_LOCK: $(($lockTimeouts | ForEach-Object Label) -join ', ') waited out the desktop lock; not a product result." }
          if ($leftovers.Count -gt 0) { throw "The round left $($leftovers.Count) process(es) behind." }

      # Diagnostics, not a deliverable: the verdict is the step above. Same reasoning as the scenarios job.
      - name: Upload real-rig evidence
        if: always() && env.RIG_EVIDENCE_ROOT != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: real-rig-evidence
          path: ${{ env.RIG_EVIDENCE_ROOT }}
          if-no-files-found: warn

      - name: Remove real-rig evidence and stage roots
        if: always() && env.RIG_EVIDENCE_ROOT != ''
        continue-on-error: true
        shell: pwsh
        run: Remove-Item -LiteralPath $env:RIG_EVIDENCE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
